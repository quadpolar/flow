<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="theme-color" content="#07060B">
<title>Flow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent; }
  html, body {
    position:fixed; inset:0; overflow:hidden; background:#07060B;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    font:500 13px/1.35 -apple-system,'Helvetica Neue',Inter,system-ui,sans-serif;
    color:#EDE9F5;
  }
  #stage { position:fixed; inset:0; }
  #view  { position:absolute; inset:0; display:block;
           width:100%; height:100%; }
  video  { position:absolute; width:1px; height:1px; opacity:0;
           pointer-events:none; }

  /* start gate — camera needs a user gesture */
  #gate {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    padding:32px; background:#07060B; z-index:5;
  }
  #gate h1 { font-size:34px; font-weight:800; letter-spacing:-.03em; }
  #gate p  { max-width:300px; opacity:.55; font-size:13px; }
  #go {
    margin-top:6px; padding:15px 40px; border:0; border-radius:30px;
    background:#C9F24A; color:#0C1004; font-weight:800; font-size:15px;
    letter-spacing:.04em; cursor:pointer;
  }
  #err { color:#FF8A7A; font-size:12px; max-width:300px; min-height:16px; }

  /* controls */
  #panel {
    position:absolute; left:0; right:0; bottom:0; z-index:4;
    background:rgba(8,7,14,.34);
    border-top:1px solid rgba(255,255,255,.07);
    padding:6px 14px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(calc(100% - 44px)); transition:transform .28s ease;
    max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #panel.open { transform:translateY(0); }
  /* while a slider is being dragged the panel drops to near-transparent,
     so the change can actually be seen underneath it */
  #panel.scrub { background:rgba(8,7,14,.06); }
  #panel.scrub .row label { opacity:.9; text-shadow:0 1px 3px #000; }
  #panel.scrub .presets, #panel.scrub .toggles { opacity:.25; }
  #panel, #panel .row label { transition:background .18s, opacity .18s; }
  #grip {
    height:24px; display:flex; align-items:center; justify-content:center;
    gap:9px; cursor:pointer; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; opacity:.65;
  }
  #grip::before {
    content:''; width:34px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.3);
  }
  .presets { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 7px; }
  .presets button {
    flex:1 1 auto; padding:7px 4px; border:1px solid rgba(255,255,255,.14);
    border-radius:11px; background:rgba(255,255,255,.05); color:#EDE9F5;
    font:700 11px/1 inherit; letter-spacing:.05em; cursor:pointer;
  }
  .presets button:active { background:rgba(201,242,74,.22); }
  .row { margin-bottom:11px; }
  .row label {
    display:flex; justify-content:space-between; font-size:10px;
    letter-spacing:.05em; text-transform:uppercase; opacity:.8;
    margin-bottom:2px; text-shadow:0 1px 4px #000, 0 0 2px #000;
  }
  .row { margin-bottom:4px; }
  .row label b { font-weight:700; opacity:.95; font-variant-numeric:tabular-nums; }
  input[type=range] {
    -webkit-appearance:none; width:100%; height:18px; background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height:3px; border-radius:2px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:19px; height:19px; margin-top:-8px;
    border-radius:50%; background:#C9F24A;
  }
  input[type=range]::-moz-range-track {
    height:3px; border-radius:2px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-moz-range-thumb {
    width:19px; height:19px; border:0; border-radius:50%; background:#C9F24A;
  }
  .toggles { display:flex; gap:6px; margin:0 0 8px; flex-wrap:wrap; }
  .toggles button {
    flex:1; padding:7px 4px; border:1px solid rgba(255,255,255,.14);
    border-radius:11px; background:rgba(255,255,255,.05); color:#EDE9F5;
    font:700 11px/1 inherit; letter-spacing:.05em; cursor:pointer;
  }
  .toggles button.on { background:#C9F24A; color:#0C1004; border-color:#C9F24A; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <video id="cam" playsinline autoplay muted></video>

  <div id="gate">
    <h1>Flow</h1>
    <p>Your camera drives the visuals. Nothing is recorded, nothing leaves
       this device.</p>
    <button id="go">START CAMERA</button>
    <div id="err"></div>
  </div>

  <div id="panel">
    <div id="grip">controls</div>

    <div class="presets">
      <button data-p="ribbon">RIBBON</button>
      <button data-p="etch">ETCH</button>
      <button data-p="skin">SKIN</button>
      <button data-p="silk">SILK</button>
      <button data-p="ghost">GHOST</button>
      <button data-p="storm">STORM</button>
    </div>

    <div class="toggles">
      <button id="tMirror" class="on">MIRROR</button>
      <button id="tParticles" class="on">LINES</button>
      <button id="tMesh">WASH</button>
    <button id="tMask">ME ONLY</button>
    <button id="tRegion" class="on">OUTSIDE</button>
    <button id="tMode" class="on">MODE&nbsp;FLOW</button>
    <button id="tBlend" class="on">SCREEN</button>
    </div>

    <div id="sliders"></div>
  </div>
</div>

<script>
(function () {
"use strict";

var view = document.getElementById("view");
var cam = document.getElementById("cam");
var gate = document.getElementById("gate");
var errEl = document.getElementById("err");
var panel = document.getElementById("panel");
var ctx = view.getContext("2d");

/* ---------- parameters. every one is read fresh each frame, so a slider
   changes the piece immediately with no restart ---------- */
var P = {
  feedback: 0.78,   // how much of the last frame is kept
  zoom:     1.002,  // scale applied to the feedback each frame
  spin:     0.02,   // degrees of rotation on the feedback
  drift:    0.08,   // how far the feedback is pushed by the flow
  warp:     10,     // mesh displacement in px per unit of flow
  chroma:   6,      // rgb channel separation
  glow:     1.0,   // brightness of the ink laid down
  hue:      0.18,   // hue rotation per second
  sat:      0.95,
  particles: 2600,
  trail:    1.0,   // particle streak length
  thresh:   0.06,   // motion below this is ignored
  edge:     1.2,    // how much the outline of you is favoured
  body:     0.35,    // how strongly your silhouette is drawn
  bleed:    0.13,  // stops light accumulating to white
  smooth:   0.30,  // how fast the field follows the camera
  speed:    0.55,  // how fast the lines travel
  deshake:  0.85,  // cancels whole-frame camera movement
  face:     0.9,   // how hard the feature outlines deflect lines
  mesh:     0.9,   // the full facial surface mesh
  dotsize:  1.1,   // radius of a landmark dot
  bwarp:    0,     // background churn only; 0 keeps your true shape
  smear:    0.42,  // vertical slit-scan bleed
  bhue:     1.0,   // palette cycling speed
  bgain:    1.35,  // contrast into the palette
  bspeed:   0.55,  // how fast the noise field drifts
  bform:    1.5,   // how much the body's own shading shows
  bsoft:    3,     // blurs the shading only, not the silhouette
  bvol:     1.3,   // the wide falloff that reads as volume
  bres:     1.0,   // output scale for the per-pixel palette
  palette:  0,     // which designed palette
  detail:   1.5,   // blur radius: low keeps features, high is smooth
  contrast: 1.4,   // local contrast lifted out of the camera image
};

var SPECS = [
  ["feedback",  "feedback",  0,    0.99,  0.01],
  ["zoom",      "zoom",      0.97, 1.05,  0.001],
  ["spin",      "spin",     -3,    3,     0.05],
  ["drift",     "drift",     0,    3,     0.05],
  ["warp",      "warp",      0,    140,   1],
  ["chroma",    "chroma",    0,    40,    1],
  ["glow",      "ink",       0,    1.6,   0.05],
  ["hue",       "hue drift", -2,   2,     0.05],
  ["sat",       "saturation",0,    1,     0.05],
  ["particles", "lines",     0,    6000,  50],
  ["trail",     "line length",0,   1,     0.05],
  ["thresh",    "threshold", 0,    0.3,   0.005],
  ["edge",      "edge bias", 0,    3,     0.05],
  ["body",      "your outline", 0, 1.5,   0.05],
  ["bleed",     "bleed",     0,    0.3,   0.005],
  ["smooth",    "smoothing", 0.02, 1,     0.01],
  ["speed",     "speed",     0.1,  2.5,   0.05],
  ["deshake",   "de-shake",  0,    1,     0.05],
  ["face",      "features",  0,    2.5,   0.05],
  ["mesh",      "face mesh", 0,    2,     0.05],
  ["dotsize",   "dot size",  0.3,  5,     0.1],
  ["bwarp",     "bloom warp", 0,   30,    0.5],
  ["smear",     "bloom smear",0,   1,     0.02],
  ["bhue",      "bloom hue", 0,    3,     0.05],
  ["bgain",     "bloom gain",0.2,  3,     0.05],
  ["bspeed",    "bloom drift",0,   2,     0.05],
  ["bform",     "bloom form", 0,   2.5,   0.05],
  ["bsoft",     "bloom soften",0,  10,    0.5],
  ["bvol",      "bloom volume",0,  3,     0.05],
  ["bres",      "bloom detail",0.4,1.6,   0.05],
  ["palette",   "palette",   0,    3,     1],
  ["detail",    "smoothness", 1,   5,     0.5],
  ["contrast",  "contrast",  0,    3,     0.05],
];

var PRESETS = {
  ribbon:  { feedback:.78, zoom:1.000, spin:0,   drift:.06, warp:12,
             chroma:7,  glow:0.85, hue:0.18, sat:0.95, particles:2600, trail:1,
             thresh:.05, edge:.9,  body:.4,  bleed:.13, smooth:0.3,
             speed:.55, deshake:.8, face:.9, mesh:.9, detail:1.5,
             contrast:1.4, dotsize:1.1, bwarp:0, smear:0.42, bhue:1.0, bgain:1.35, bspeed:0.55, bform:1.6, bsoft:3, bvol:1.3, bres:1.0, palette:0         },
  etch:    { feedback:.72, zoom:1.000, spin:0,   drift:.04, warp:8,
             chroma:5,  glow:0.9,hue:0.12, sat:0.85,  particles:4200, trail:1,
             thresh:.05, edge:.7,  body:.3,  bleed:.16, smooth:0.28,
             speed:.42, deshake:.9, face:.75, mesh:1.5, detail:1,
             contrast:2.1, dotsize:0.7, bwarp:0, smear:0.25, bhue:0.7, bgain:1.6, bspeed:0.4, bform:2.1, bsoft:2, bvol:1.6, bres:1.1, palette:2         },
  skin:    { feedback:.84, zoom:1.000, spin:.01, drift:.05, warp:10,
             chroma:6,  glow:0.8, hue:0.1, sat:0.8,  particles:3800, trail:.95,
             thresh:.06, edge:.8,  body:.28, bleed:.10, smooth:0.26,
             speed:.4,  deshake:.9, face:.5, mesh:1.8, detail:1,
             contrast:2.6, dotsize:0.9, bwarp:0, smear:0.35, bhue:0.8, bgain:1.4, bspeed:0.45, bform:1.9, bsoft:2.5, bvol:1.5, bres:1.0, palette:0         },
  silk:    { feedback:.90, zoom:1.001, spin:.02, drift:.08, warp:9,
             chroma:5,  glow:0.65,  hue:0.08, sat:0.7,  particles:3000, trail:.85,
             thresh:.06, edge:1.0, body:.35, bleed:.07, smooth:0.24,
             speed:.30, deshake:.9, face:.9, mesh:.8, detail:2,
             contrast:1.2, dotsize:1.2, bwarp:0, smear:0.55, bhue:0.8, bgain:1.2, bspeed:0.35, bform:1.3, bsoft:4, bvol:1.1, bres:0.9, palette:1         },
  ghost:   { feedback:.95, zoom:1.000, spin:0,   drift:.05, warp:6,
             chroma:3,  glow:0.45, hue:0.05, sat:0.35,  particles:2200, trail:.95,
             thresh:.07, edge:1.5, body:.28, bleed:.04, smooth:0.18,
             speed:.22, deshake:.95, face:.8, mesh:.6, detail:2.5,
             contrast:.9, dotsize:0.8, bwarp:4, smear:0.75, bhue:0.5, bgain:1.0, bspeed:0.25, bform:1.0, bsoft:5, bvol:0.9, bres:0.8, palette:3         },
  storm:   { feedback:.88, zoom:1.004, spin:.18, drift:.5,  warp:44,
             chroma:16, glow:0.85, hue:0.35, sat:1,   particles:4000, trail:.6,
             thresh:.04, edge:.8,  body:.55, bleed:.08, smooth:0.45,
             speed:.9,  deshake:.6, face:.6, mesh:.7, detail:2,
             contrast:1.0, dotsize:1.4, bwarp:8, smear:0.85, bhue:2.2, bgain:1.7, bspeed:1.2, bform:1.7, bsoft:3.5, bvol:1.8, bres:0.9, palette:2         },
};






var mirror = true, useParticles = true, useMesh = false, useMask = false;
var region = 1;   // 0 inside you, 1 outside you, 2 both
var mode = 0;     // 0 flow, 1 dots, 2 mesh, 3 both, 4 bloom
var blend = "screen";   // screen keeps hue, lighter goes white

/* ---------- build the sliders ---------- */
var wrap = document.getElementById("sliders");
var readouts = {};
SPECS.forEach(function (sp) {
  var key = sp[0];
  var row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<label>' + sp[1] + ' <b></b></label>' +
    '<input type="range" min="' + sp[2] + '" max="' + sp[3] +
    '" step="' + sp[4] + '">';
  var input = row.querySelector("input");
  var out = row.querySelector("b");
  readouts[key] = { input: input, out: out, step: sp[4] };
  input.value = P[key];
  out.textContent = fmt(P[key], sp[4]);
  input.addEventListener("input", function () {
    P[key] = parseFloat(input.value);
    out.textContent = fmt(P[key], sp[4]);
  });
  var clear;
  function scrubOn() {
    panel.classList.add("scrub");
    clearTimeout(clear);
  }
  function scrubOff() {
    clearTimeout(clear);
    clear = setTimeout(function () { panel.classList.remove("scrub"); }, 450);
  }
  input.addEventListener("pointerdown", scrubOn);
  input.addEventListener("touchstart", scrubOn, { passive: true });
  input.addEventListener("input", scrubOn);
  input.addEventListener("pointerup", scrubOff);
  input.addEventListener("touchend", scrubOff, { passive: true });
  input.addEventListener("change", scrubOff);
  wrap.appendChild(row);
});

function fmt(v, step) {
  var d = step >= 1 ? 0 : String(step).split(".")[1].length;
  return v.toFixed(d);
}

function syncUI() {
  SPECS.forEach(function (sp) {
    var r = readouts[sp[0]];
    r.input.value = P[sp[0]];
    r.out.textContent = fmt(P[sp[0]], r.step);
  });
}

document.querySelectorAll(".presets button").forEach(function (b) {
  b.addEventListener("click", function () {
    var pr = PRESETS[b.dataset.p];
    for (var k in pr) P[k] = pr[k];
    syncUI();
  });
});

function toggle(id, get, set) {
  var el = document.getElementById(id);
  el.addEventListener("click", function () {
    set(!get());
    el.classList.toggle("on", get());
  });
}
toggle("tMirror", function () { return mirror; },
       function (v) { mirror = v; });
toggle("tParticles", function () { return useParticles; },
       function (v) { useParticles = v; });
toggle("tMesh", function () { return useMesh; },
       function (v) { useMesh = v; });
toggle("tMask", function () { return useMask; },
       function (v) {
         useMask = v;
         if (v && !segReady && !segTried) loadSegmenter();
         // make the change unmistakable rather than subtle
         if (v && P.body < 0.5) {
           P.body = 0.9;
           var r = readouts["body"];
           if (r) { r.input.value = P.body; r.out.textContent = fmt(P.body, r.step); }
         }
       });

(function () {
  var el = document.getElementById("tBlend");
  el.addEventListener("click", function () {
    blend = blend === "screen" ? "lighter" : "screen";
    el.textContent = blend === "screen" ? "SCREEN" : "ADD";
  });
})();

(function () {
  var el = document.getElementById("tMode");
  var names = ["FLOW", "DOTS", "MESH", "BOTH", "BLOOM"];
  el.addEventListener("click", function () {
    mode = (mode + 1) % 5;
    el.innerHTML = "MODE&nbsp;" + names[mode];
    if (mode > 0 && !useMask) {
      useMask = true;
      var m = document.getElementById("tMask");
      m.classList.add("on");
      if (!segTried) loadSegmenter();
    }
  });
})();

(function () {
  var el = document.getElementById("tRegion");
  var names = ["INSIDE", "OUTSIDE", "BOTH"];
  el.addEventListener("click", function () {
    region = (region + 1) % 3;
    el.textContent = names[region];
    el.classList.toggle("on", true);
    tracers.length = 0;        // reseed into the new region immediately
  });
})();

document.getElementById("grip").addEventListener("click", function () {
  panel.classList.toggle("open");
});

// tapping the picture hides the panel, so a setting can be judged clean
view.addEventListener("pointerdown", function () {
  panel.classList.remove("open");
});

/* ---------- person mask ----------
   MediaPipe Image Segmenter, loaded from a CDN on demand. it returns a
   per-pixel person/background mask which is downsampled onto the flow grid,
   so motion in the background can be suppressed and the outline of the
   subject can be emphasised. entirely optional — if the CDN is unreachable
   the toggle switches itself off and everything else carries on. */
var segmenter = null, segReady = false, segTried = false, segErr = "";
var faceLM = null, faceReady = false, faceConn = null;
var faceCanvas = null, fctx = null;
var MW = 176, MH = 132;   // mask resolution — coarse here is the main
                          // source of visible aliasing downstream
var maskGrid = new Float32Array(MW * MH);
var maskBlur = new Float32Array(MW * MH);
var maskCanvas = document.createElement("canvas");
maskCanvas.width = MW; maskCanvas.height = MH;
var mctx = maskCanvas.getContext("2d", { willReadFrequently: true });

/* a higher-resolution silhouette, used to actually DRAW you rather than
   just weight the abstract layers. without something on screen shaped like
   a person there is no way to tell the effect is reacting to you at all. */
var SILW = 384, SILH = 288;  // resized to the video aspect
var sil = document.createElement("canvas");
sil.width = SILW; sil.height = SILH;
var silctx = sil.getContext("2d");
var silImg = silctx.createImageData(SILW, SILH);
var silReady = false;
/* ---------- streamline field ----------
   the references are all flow fields: thousands of thin curves following the
   contours of a face. that needs a SMOOTH scalar field, not a hard mask —
   the contour direction is perpendicular to the gradient, and a hard edge
   gives a gradient that is zero everywhere except one pixel. so the mask is
   blurred heavily, sampled bilinearly, and combined with the camera's own
   luminance so the interior has structure too. */
var FW = 288, FH = 216;   // resized to the video aspect on first frame
var fieldA = new Float32Array(FW * FH);
var fieldB = new Float32Array(FW * FH);
var fieldPrev = new Float32Array(FW * FH);
var fieldSeeded = false;
var fieldMax = 1;

function buildField(arr, w, h, lumaSrc) {
  // mask, plus luminance inside it so the face has internal contours
  for (var y = 0; y < FH; y++) {
    var ry = Math.floor(y * h / FH);
    for (var x = 0; x < FW; x++) {
      var rx = Math.floor(x * w / FW);
      var on = arr[ry * w + rx] !== 0 ? 1 : 0;
      var l = lumaSrc ? lumaSrc[(y * FW + x)] : 0;
      /* luminance dominates inside the mask, so the face and torso carry
         real contours. with a flat interior the gradient is zero and the
         only lines that appear are on the silhouette edge. */
      /* a gentle built-in slope inside the mask. a flat patch of cheek has
         no gradient, so a tracer there dies immediately and the face stays
         empty. this guarantees flow everywhere on the body while staying
         weak enough that real shading and landmarks dominate the shape. */
      var slope = on ? (0.30 + 0.22 * Math.sin(x * 0.055 + y * 0.021)
                             + 0.16 * (y / FH)) : 0;
      var base = on ? (slope + l * 2.4) : 0;
      /* face contours raise the field, so a streamline following a line of
         constant value is deflected around an eyelid or a lip the same way
         it is deflected around the body. */
      if (faceSeen && P.face > 0) {
        base += faceField[y * FW + x] * P.face * (on ? 1 : 0.35);
      }
      fieldA[y * FW + x] = base;
    }
  }
  /* separable box blur. a wide radius matters more than many small passes:
     the streamline has to see a smooth field or it wanders off its isoline.
     measured, radius 3 takes the drift from 0.19 to under 0.10. */
  var R = Math.max(1, Math.round(P.detail));
  for (var pass = 0; pass < 2; pass++) {
    for (var y3 = 0; y3 < FH; y3++) {
      var base = y3 * FW;
      for (var x3 = 0; x3 < FW; x3++) {
        var sum = 0, cnt = 0;
        for (var k = -R; k <= R; k++) {
          var xx = x3 + k;
          if (xx < 0 || xx >= FW) continue;
          sum += fieldA[base + xx]; cnt++;
        }
        fieldB[base + x3] = sum / cnt;
      }
    }
    for (var x4 = 0; x4 < FW; x4++) {
      for (var y4 = 0; y4 < FH; y4++) {
        var sum2 = 0, cnt2 = 0;
        for (var k2 = -R; k2 <= R; k2++) {
          var yy = y4 + k2;
          if (yy < 0 || yy >= FH) continue;
          sum2 += fieldB[yy * FW + x4]; cnt2++;
        }
        fieldA[y4 * FW + x4] = sum2 / cnt2;
      }
    }
  }

  /* ease the field toward its new state instead of replacing it. a knock to
     the camera and a flickering segmentation edge both arrive as a sudden
     change; blending removes the jitter from both without losing detail. */
  /* adaptive. the smoothing exists to absorb jitter while you are still,
     but the same easing reads as lag when you move. so it opens up in
     proportion to how much of the frame is actually moving. */
  var motion = 0;
  for (var mi2 = 0; mi2 < fm.length; mi2++) motion += fm[mi2];
  motion = Math.min(1, (motion / Math.max(1, fm.length)) * 26);
  var ease = fieldSeeded
    ? Math.min(1, P.smooth + motion * (1 - P.smooth) * 0.9)
    : 1;
  fieldSeeded = true;
  for (var i2 = 0; i2 < fieldA.length; i2++) {
    fieldPrev[i2] += (fieldA[i2] - fieldPrev[i2]) * ease;
    fieldA[i2] = fieldPrev[i2];
  }
  // track the peak so thresholds are relative, not absolute
  var pk = 0;
  for (var i3 = 0; i3 < fieldA.length; i3++) {
    if (fieldA[i3] > pk) pk = fieldA[i3];
  }
  fieldMax = Math.max(0.05, pk);
}

function fsamp(x, y) {
  x = Math.max(2, Math.min(FW - 3, x));
  y = Math.max(2, Math.min(FH - 3, y));
  var x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
  var i = y0 * FW + x0;
  return fieldA[i] * (1 - fx) * (1 - fy) + fieldA[i + 1] * fx * (1 - fy) +
         fieldA[i + FW] * (1 - fx) * fy + fieldA[i + FW + 1] * fx * fy;
}

/* the camera is 4:3 and the phone is much taller. drawing the mask across
   the full screen stretches it — measured, that squashes x to 0.35 of its
   correct width. cover-fit scales to fill and crops the overflow instead. */
function coverRect() {
  /* the aspect must come from the VIDEO, not from the buffer it was sampled
     into. iOS often delivers portrait frames; assuming 4:3 stretches the
     mask horizontally, which reads as the subject being too wide. */
  var vw = cam.videoWidth || 640, vh = cam.videoHeight || 480;
  var sc = Math.max(W / vw, H / vh);
  var dw = vw * sc, dh = vh * sc;
  return { x: (W - dw) / 2, y: (H - dh) / 2, w: dw, h: dh };
}

/* the contour direction: perpendicular to the gradient */
function contourAt(x, y) {
  var d = 1.0 + P.detail * 0.55;
  var gx = fsamp(x + d, y) - fsamp(x - d, y);
  var gy = fsamp(x, y + d) - fsamp(x, y - d);
  var m = Math.hypot(gx, gy);
  if (m < 1e-4) return null;
  return { x: -gy / m, y: gx / m, m: m };
}

/* luminance of the camera at field resolution, so the interior of the face
   carries contours rather than being flat */
var lumaField = new Float32Array(FW * FH);
var lumaBlur = new Float32Array(FW * FH);
function buildLuma() {
  var d = sctx.getImageData(0, 0, SW, SH).data;
  var lo = 1, hi = 0;
  for (var y = 0; y < FH; y++) {
    var ry = Math.floor(y * SH / FH);
    for (var x = 0; x < FW; x++) {
      var rx = Math.floor(x * SW / FW);
      var i = (ry * SW + rx) * 4;
      var l = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
      lumaField[y * FW + x] = l;
      if (l < lo) lo = l;
      if (l > hi) hi = l;
    }
  }
  /* stretch to the full range. a backlit or evenly lit face has almost no
     contrast, which leaves the interior field flat and gives the streamlines
     nothing to follow — the reason lines only appeared around the edge. */
  var span = Math.max(0.08, hi - lo);
  for (var j = 0; j < lumaField.length; j++) {
    lumaField[j] = (lumaField[j] - lo) / span;
  }

  /* local contrast. a global stretch cannot recover a cheekbone or a nostril
     because those are small differences sitting on a large gradient.
     subtracting a blurred copy leaves exactly that fine structure. */
  if (P.contrast > 0) {
    var LR = 6;
    for (var y2 = 0; y2 < FH; y2++) {
      var b2 = y2 * FW;
      for (var x2 = 0; x2 < FW; x2++) {
        var sm = 0, cn = 0;
        for (var k = -LR; k <= LR; k += 2) {
          var xx = x2 + k;
          if (xx < 0 || xx >= FW) continue;
          sm += lumaField[b2 + xx]; cn++;
        }
        lumaBlur[b2 + x2] = sm / cn;
      }
    }
    for (var x3 = 0; x3 < FW; x3++) {
      for (var y3 = 0; y3 < FH; y3++) {
        var sm2 = 0, cn2 = 0;
        for (var k2 = -LR; k2 <= LR; k2 += 2) {
          var yy = y3 + k2;
          if (yy < 0 || yy >= FH) continue;
          sm2 += lumaBlur[yy * FW + x3]; cn2++;
        }
        var base = sm2 / cn2;
        var i3 = y3 * FW + x3;
        var hp = lumaField[i3] - base;
        lumaField[i3] = Math.max(0, Math.min(1,
          lumaField[i3] + hp * P.contrast * 2.2));
      }
    }
  }
}

var rim = document.createElement("canvas");
rim.width = SILW; rim.height = SILH;
var rctx = rim.getContext("2d");
var tint = document.createElement("canvas");
tint.width = SILW; tint.height = SILH;
var tctx = tint.getContext("2d");

function loadSegmenter() {
  segTried = true;
  var el = document.getElementById("tMask");
  el.textContent = "LOADING…";
  import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14")
    .then(function (v) {
      return v.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      ).then(function (fileset) {
        return v.ImageSegmenter.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/" +
              "image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          outputCategoryMask: true,
          outputConfidenceMasks: false,
        });
      });
    })
    .then(function (seg) {
      segmenter = seg; segReady = true;
      el.textContent = "ME ONLY";
      loadFace();
    })
    .catch(function (e) {
      segErr = String(e && e.message ? e.message : e);
      useMask = false; segReady = false;
      el.textContent = "ME ONLY";
      el.classList.remove("on");
      errEl.textContent = "Person mask unavailable — using plain motion.";
      setTimeout(function () { errEl.textContent = ""; }, 3400);
    });
}

function matchAspect() {
  var vw = cam.videoWidth, vh = cam.videoHeight;
  if (!vw || !vh) return;
  var a = vw / vh;
  var nSW = a >= 1 ? 384 : Math.round(384 * a);
  var nSH = a >= 1 ? Math.round(384 / a) : 384;
  if (nSW !== SW || nSH !== SH) {
    SW = nSW; SH = nSH;
    small.width = SW; small.height = SH;
    prev = null;
  }
  var nFW = a >= 1 ? 288 : Math.round(288 * a);
  var nFH = a >= 1 ? Math.round(288 / a) : 288;
  if (nFW !== FW || nFH !== FH) {
    FW = nFW; FH = nFH;
    fieldA = new Float32Array(FW * FH);
    fieldB = new Float32Array(FW * FH);
    fieldPrev = new Float32Array(FW * FH);
    fieldSeeded = false;
    lumaField = new Float32Array(FW * FH);
    lumaBlur = new Float32Array(FW * FH);
    tracers.length = 0;
  }
  var nSILW = a >= 1 ? 384 : Math.round(384 * a);
  var nSILH = a >= 1 ? Math.round(384 / a) : 384;
  if (nSILW !== SILW || nSILH !== SILH) {
    SILW = nSILW; SILH = nSILH;
    sil.width = SILW; sil.height = SILH;
    rim.width = SILW; rim.height = SILH;
    tint.width = SILW; tint.height = SILH;
    silImg = silctx.createImageData(SILW, SILH);
  }
}

/* ---------- face landmarks ----------
   478 tracked points with real eye, lip, nose and brow geometry. the mask
   gives the silhouette and the luminance gives soft shading; this adds the
   hard structure that shading alone cannot resolve — eyelids, lip line,
   nostrils, jaw. the contours are rasterised into the field so streamlines
   wrap them the same way they wrap the body. */
function loadFace() {
  import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14")
    .then(function (v) {
      return v.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      ).then(function (fileset) {
        return v.FaceLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/" +
              "face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: false,
        }).then(function (lm) {
          // the connector sets are static on the class
          faceConn = {
            lips:   v.FaceLandmarker.FACE_LANDMARKS_LIPS,
            lEye:   v.FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,
            rEye:   v.FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
            lBrow:  v.FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW,
            rBrow:  v.FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW,
            oval:   v.FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,
            mesh:   v.FaceLandmarker.FACE_LANDMARKS_TESSELATION,
            lIris:  v.FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS,
            rIris:  v.FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS,
          };
          faceLM = lm; faceReady = true;
          faceCanvas = document.createElement("canvas");
          faceCanvas.width = FW; faceCanvas.height = FH;
          fctx = faceCanvas.getContext("2d", { willReadFrequently: true });
        });
      });
    })
    .catch(function () { faceReady = false; });
}

var faceField = new Float32Array(FW * FH);
var faceSeen = false;
var facePts = null;

function drawConn(pts, conn, w, alpha) {
  if (!conn) return;
  fctx.lineWidth = w;
  fctx.strokeStyle = "rgba(255,255,255," + alpha + ")";
  fctx.beginPath();
  for (var i = 0; i < conn.length; i++) {
    var a = pts[conn[i].start], b = pts[conn[i].end];
    if (!a || !b) continue;
    fctx.moveTo(a.x * FW, a.y * FH);
    fctx.lineTo(b.x * FW, b.y * FH);
  }
  fctx.stroke();
}

function updateFace(tms) {
  if (!faceReady || !faceLM || !fctx) return;
  if (faceCanvas.width !== FW || faceCanvas.height !== FH) {
    faceCanvas.width = FW; faceCanvas.height = FH;
    faceField = new Float32Array(FW * FH);
  }
  try {
    var res = faceLM.detectForVideo(cam, tms);
    if (!res || !res.faceLandmarks || !res.faceLandmarks.length) {
      faceSeen = false; facePts = null;
      for (var z = 0; z < faceField.length; z++) faceField[z] *= 0.86;
      return;
    }
    faceSeen = true;
    var pts = res.faceLandmarks[0];
    facePts = pts;

    fctx.clearRect(0, 0, FW, FH);
    fctx.lineCap = "round";
    fctx.lineJoin = "round";

    /* the full tessellation first, very faint. this is the actual surface —
       every cheek, jaw and forehead facet — where the feature outlines only
       describe boundaries. it is what stops the face reading as a mask with
       holes cut in it. */
    if (P.mesh > 0 && faceConn.mesh) {
      drawConn(pts, faceConn.mesh, 0.7, 0.16 * P.mesh);
    }
    /* weighted by how much each feature should deflect a streamline. the
       eyes and lips read hardest, the oval is a soft boundary. */
    drawConn(pts, faceConn.oval,  1.6, 0.34);
    drawConn(pts, faceConn.lBrow, 1.7, 0.52);
    drawConn(pts, faceConn.rBrow, 1.7, 0.52);
    drawConn(pts, faceConn.lEye,  1.6, 0.62);
    drawConn(pts, faceConn.rEye,  1.6, 0.62);
    drawConn(pts, faceConn.lips,  1.8, 0.62);
    drawConn(pts, faceConn.lIris, 1.4, 0.55);
    drawConn(pts, faceConn.rIris, 1.4, 0.55);

    // the nose bridge and base, which have no connector set
    var NOSE = [168, 6, 197, 195, 5, 4, 1, 19, 94, 2];
    var WING = [98, 97, 2, 326, 327];
    fctx.lineWidth = 1.6;
    fctx.strokeStyle = "rgba(255,255,255,0.55)";
    for (var g = 0; g < 2; g++) {
      var set = g ? WING : NOSE;
      fctx.beginPath();
      for (var k = 0; k < set.length; k++) {
        var q = pts[set[k]];
        if (!q) continue;
        if (k === 0) fctx.moveTo(q.x * FW, q.y * FH);
        else fctx.lineTo(q.x * FW, q.y * FH);
      }
      fctx.stroke();
    }

    var d = fctx.getImageData(0, 0, FW, FH).data;
    for (var i2 = 0; i2 < faceField.length; i2++) {
      var v = d[i2 * 4 + 3] / 255;
      faceField[i2] += (v - faceField[i2]) * 0.8;
    }
  } catch (e) { /* a dropped frame is not worth stopping for */ }
}

function updateMask(tms) {
  if (!segReady || !segmenter) return;
  try {
    var res = segmenter.segmentForVideo(cam, tms);
    var cat = res && res.categoryMask;
    if (!cat) return;
    var w = cat.width, h = cat.height;
    var arr = cat.getAsUint8Array();
    // downsample onto the flow grid by area averaging
    for (var gy = 0; gy < MH; gy++) {
      var y0 = Math.floor(gy * h / MH), y1 = Math.floor((gy + 1) * h / MH);
      for (var gx = 0; gx < MW; gx++) {
        var x0 = Math.floor(gx * w / MW), x1 = Math.floor((gx + 1) * w / MW);
        var hit = 0, n = 0;
        for (var y = y0; y <= y1; y++) {
          for (var x = x0; x <= x1; x++) {
            if (y >= h || x >= w) continue;
            if (arr[y * w + x] !== 0) hit++;
            n++;
          }
        }
        var v = n ? hit / n : 0;
        var i = gy * MW + gx;
        maskGrid[i] += (v - maskGrid[i]) * 0.72;   // soften over time
      }
    }

    /* anti-alias the mask. area averaging cannot help once a grid cell
       covers roughly one source pixel — the result is binary again, and a
       binary edge stair-steps through every downstream blur. a short
       separable blur gives the boundary real intermediate values. */
    var MR = 3;
    for (var mp = 0; mp < 2; mp++) {
    for (var by2 = 0; by2 < MH; by2++) {
      var bb = by2 * MW;
      for (var bx2 = 0; bx2 < MW; bx2++) {
        var sm3 = 0, cn3 = 0;
        for (var kx = -MR; kx <= MR; kx++) {
          var qx = bx2 + kx;
          if (qx < 0 || qx >= MW) continue;
          sm3 += maskGrid[bb + qx]; cn3++;
        }
        maskBlur[bb + bx2] = sm3 / cn3;
      }
    }
    for (var bx3 = 0; bx3 < MW; bx3++) {
      for (var by3 = 0; by3 < MH; by3++) {
        var sm4 = 0, cn4 = 0;
        for (var ky = -MR; ky <= MR; ky++) {
          var qy = by3 + ky;
          if (qy < 0 || qy >= MH) continue;
          sm4 += maskBlur[qy * MW + bx3]; cn4++;
        }
        maskGrid[by3 * MW + bx3] = sm4 / cn4;
      }
    }
    }
    // and a proper silhouette bitmap at higher resolution
    var d = silImg.data;
    for (var sy = 0; sy < SILH; sy++) {
      var ry = Math.floor(sy * h / SILH);
      for (var sx = 0; sx < SILW; sx++) {
        var rx = Math.floor(sx * w / SILW);
        /* sample a small neighbourhood instead of one pixel. a 1-bit mask
           upscaled to the screen stair-steps badly; averaging gives a soft
           edge that survives the scale. */
        var acc = 0, cnt3 = 0;
        for (var ny = -1; ny <= 1; ny++) {
          for (var nx = -1; nx <= 1; nx++) {
            var qy = ry + ny * 2, qx = rx + nx * 2;
            if (qy < 0 || qy >= h || qx < 0 || qx >= w) continue;
            if (arr[qy * w + qx] !== 0) acc++;
            cnt3++;
          }
        }
        var o = (sy * SILW + sx) * 4;
        d[o] = 255; d[o + 1] = 255; d[o + 2] = 255;
        d[o + 3] = cnt3 ? Math.round(255 * acc / cnt3) : 0;
      }
    }
    silctx.putImageData(silImg, 0, 0);
    silReady = true;
    buildLuma();
    buildField(arr, w, h, lumaField);

    cat.close();
  } catch (e) { /* a dropped frame is not worth stopping for */ }
}

/* how much of "you" is at this point, 0..1, plus an edge term so the
   silhouette itself reads strongest */
/* raw coverage at a point, 0 outside you and 1 inside. maskAt adds an edge
   term for weighting; this is the plain answer to "is this me". */
/* luminance at a normalised point, bilinear. the bloom needs interior
   variation or the subject is a flat blob — the mask alone gives one value
   across the whole body, so the gradient map has nothing to work with. */
function lumaAt(u, v) {
  var fx2 = Math.max(0, Math.min(FW - 1.001, u * FW - 0.5));
  var fy2 = Math.max(0, Math.min(FH - 1.001, v * FH - 0.5));
  var x0 = fx2 | 0, y0 = fy2 | 0;
  var ax = fx2 - x0, ay = fy2 - y0;
  var x1 = Math.min(FW - 1, x0 + 1), y1 = Math.min(FH - 1, y0 + 1);
  var r0 = y0 * FW, r1 = y1 * FW;
  return lumaField[r0 + x0] * (1 - ax) * (1 - ay) +
         lumaField[r0 + x1] * ax * (1 - ay) +
         lumaField[r1 + x0] * (1 - ax) * ay +
         lumaField[r1 + x1] * ax * ay;
}

function coverAt(u, v) {
  if (!segReady) return 0;
  /* bilinear. nearest-neighbour on a coarse grid gives hard steps that
     survive every downstream blur — the aliasing was here, not in the
     buffers being upscaled. */
  var fx2 = Math.max(0, Math.min(MW - 1.001, u * MW - 0.5));
  var fy2 = Math.max(0, Math.min(MH - 1.001, v * MH - 0.5));
  var x0 = fx2 | 0, y0 = fy2 | 0;
  var ax = fx2 - x0, ay = fy2 - y0;
  var x1 = Math.min(MW - 1, x0 + 1), y1 = Math.min(MH - 1, y0 + 1);
  var r0 = y0 * MW, r1 = y1 * MW;
  return maskGrid[r0 + x0] * (1 - ax) * (1 - ay) +
         maskGrid[r0 + x1] * ax * (1 - ay) +
         maskGrid[r1 + x0] * (1 - ax) * ay +
         maskGrid[r1 + x1] * ax * ay;
}

/* is a point in field space allowed for the current region? */
function regionOK(fxp, fyp) {
  if (region === 2) return true;
  var c = coverAt(fxp / FW, fyp / FH);
  return region === 0 ? c > 0.45 : c < 0.45;
}

function maskAt(u, v) {
  if (!useMask || !segReady) return 1;
  var gx = Math.max(0, Math.min(MW - 1, Math.floor(u * MW)));
  var gy = Math.max(0, Math.min(MH - 1, Math.floor(v * MH)));
  var c = maskGrid[gy * MW + gx];
  if (P.edge <= 0) return c;
  var l = maskGrid[gy * MW + Math.max(0, gx - 1)];
  var r = maskGrid[gy * MW + Math.min(MW - 1, gx + 1)];
  var t = maskGrid[Math.max(0, gy - 1) * MW + gx];
  var b = maskGrid[Math.min(MH - 1, gy + 1) * MW + gx];
  var edge = Math.abs(l - r) + Math.abs(t - b);
  return Math.min(1.6, c + edge * P.edge);
}

/* ---------- optical flow ----------
   the video is drawn into a small hidden canvas, and each cell is compared
   with the same cell in the previous frame. shifting the cell by one step in
   each direction and taking whichever shift best explains the change gives a
   direction — that is the flow. no model, no face detection, works in any
   light and responds to hands and background too. */
var SW = 384, SH = 288;         // sampling resolution, corrected to the video
var COLS = 32, ROWS = 24;       // flow grid
var small = document.createElement("canvas");
small.width = SW; small.height = SH;
var sctx = small.getContext("2d", { willReadFrequently: true });

var prev = null;
var fx = new Float32Array(COLS * ROWS);
var fy = new Float32Array(COLS * ROWS);
var fm = new Float32Array(COLS * ROWS);

function lum(d, x, y) {
  var i = (y * SW + x) * 4;
  return (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
}

function computeFlow() {
  sctx.drawImage(cam, 0, 0, SW, SH);
  var cur = sctx.getImageData(0, 0, SW, SH).data;
  if (!prev) { prev = cur; return; }

  var cw = SW / COLS, ch = SH / ROWS;
  for (var gy = 0; gy < ROWS; gy++) {
    for (var gx = 0; gx < COLS; gx++) {
      var px = Math.floor(gx * cw + cw / 2);
      var py = Math.floor(gy * ch + ch / 2);
      if (px < 2 || py < 2 || px > SW - 3 || py > SH - 3) continue;

      var diff = 0, n = 0;
      for (var oy = -1; oy <= 1; oy++) {
        for (var ox = -1; ox <= 1; ox++) {
          diff += Math.abs(lum(cur, px + ox, py + oy) -
                           lum(prev, px + ox, py + oy));
          n++;
        }
      }
      diff /= n;

      // spatial gradient of the current frame
      var gxv = lum(cur, px + 2, py) - lum(cur, px - 2, py);
      var gyv = lum(cur, px, py + 2) - lum(cur, px, py - 2);
      // temporal difference
      var dt = lum(cur, px, py) - lum(prev, px, py);
      var g2 = gxv * gxv + gyv * gyv + 1e-4;

      var i = gy * COLS + gx;
      var vx = -dt * gxv / g2;
      var vy = -dt * gyv / g2;
      vx = Math.max(-3, Math.min(3, vx));
      vy = Math.max(-3, Math.min(3, vy));
      // smooth over time so the field is fluid rather than jittery
      fx[i] += (vx - fx[i]) * 0.35;
      fy[i] += (vy - fy[i]) * 0.35;
      fm[i] += (diff - fm[i]) * 0.4;
    }
  }
  /* a knock to the camera moves every cell at once. subtracting the median
     drift leaves only motion that is genuinely yours, which is what stops
     the whole field lurching when the phone is jostled. */
  var mx2 = 0, my2 = 0, cnt4 = 0;
  for (var q = 0; q < fx.length; q++) {
    if (fm[q] > 0.01) { mx2 += fx[q]; my2 += fy[q]; cnt4++; }
  }
  if (cnt4 > fx.length * 0.35) {          // only when MOST cells are moving
    mx2 /= cnt4; my2 /= cnt4;
    for (var q2 = 0; q2 < fx.length; q2++) {
      fx[q2] -= mx2 * P.deshake;
      fy[q2] -= my2 * P.deshake;
    }
  }
  prev = cur;
}

function sampleFlow(u, v) {
  if (!isFinite(u) || !isFinite(v)) return { x: 0, y: 0, m: 0 };
  var gx = Math.max(0, Math.min(COLS - 1, Math.floor(u * COLS)));
  var gy = Math.max(0, Math.min(ROWS - 1, Math.floor(v * ROWS)));
  var i = gy * COLS + gx;
  var a = fx[i], b = fy[i], c = fm[i];
  return { x: isFinite(a) ? a : 0, y: isFinite(b) ? b : 0,
           m: isFinite(c) ? c : 0 };
}

/* one dot on the face. hoisted out of the frame loop — defining it inside
   would allocate a closure every frame, and this runs thousands of times. */
var dotCtx = null, dotCrm = null, dotZs = 0, dotHue = 0,
    dotAlpha = 1, dotSat = 80, dotW = 0, dotH = 0;
function dot(nx, ny, nz) {
  var px = dotCrm.x + nx * dotCrm.w, py = dotCrm.y + ny * dotCrm.h;
  if (px < -20 || px > dotW + 20 || py < -20 || py > dotH + 20) return;
  var dz = (nz - dotZs) * 14;
  var r = Math.max(0.25, P.dotsize * (1 - dz * 0.5));
  dotCtx.fillStyle = "hsl(" + ((dotHue + dz * 90 + 360) % 360) + "," +
    dotSat + "%," +
    Math.round(58 + Math.max(-25, Math.min(25, -dz * 40))) + "%)";
  dotCtx.globalAlpha = dotAlpha;
  dotCtx.beginPath();
  dotCtx.arc(px, py, r, 0, 6.3);
  dotCtx.fill();
}

/* ---------- bloom ----------
   a different render path entirely: no lines. the person mask is blurred to
   a soft scalar field, warped by a drifting noise field, smeared vertically,
   and remapped through a thermal palette. built at low resolution as raw
   pixels and upscaled, which gives the blur for free. */
var BW = 128, BH = 226;
var bloomF = new Float32Array(BW * BH);
var bloomT = new Float32Array(BW * BH);
var bloomL = new Float32Array(BW * BH);
var bloomL2 = new Float32Array(BW * BH);
var bloomD = new Float32Array(BW * BH);

/* a pyramid of successively halved copies. blurring at each level and
   summing gives a very wide, smooth falloff from the silhouette edge for a
   fraction of the cost of one wide blur at full size. that falloff is the
   volume: the middle of the body reads as near, the edges fall away. */
var PYR = [];
(function () {
  var w = BW, h = BH;
  for (var i = 0; i < 4; i++) {
    w = Math.max(4, w >> 1); h = Math.max(4, h >> 1);
    PYR.push({ w: w, h: h, a: new Float32Array(w * h),
               b: new Float32Array(w * h) });
  }
})();

/* the output is rendered at CSS resolution with a palette lookup PER PIXEL.
   mapping to colour first and then upscaling smears every band boundary
   across several screen pixels and produces in-between colours that are in
   neither stop — that is what reads as low resolution even when the form
   itself is legitimately soft. */
var outCv = document.createElement("canvas");
var octx = outCv.getContext("2d");
var outImg = null, outW = 0, outH = 0;

function noise2(x, y, t) {
  return (Math.sin(x * 0.11 + t * 0.7) * Math.cos(y * 0.09 - t * 0.5) +
          Math.sin(x * 0.23 - y * 0.17 + t * 1.1) * 0.6 +
          Math.sin(y * 0.31 + t * 0.9) * 0.4) / 2;
}

/* a designed palette rather than a spectrum. sampling the reference gives
   one saturated colour holding about a fifth of the frame and everything
   else between 0.22 and 0.44 saturation — restraint is doing the work, and
   a full hue circle at maximum saturation cannot look like that. */
var PALETTES = [
  [[16, 28, 96], [38, 62, 214], [128, 128, 226], [226, 168, 186],
   [246, 196, 158], [252, 226, 206]],
  [[10, 16, 26], [26, 64, 92], [64, 132, 140], [186, 176, 150],
   [238, 206, 168], [250, 238, 224]],
  [[24, 10, 34], [96, 26, 74], [186, 62, 96], [232, 122, 96],
   [244, 178, 130], [250, 226, 200]],
  [[8, 20, 20], [22, 74, 74], [58, 138, 122], [148, 190, 150],
   [214, 226, 190], [244, 246, 232]],
];

function paletteAt(v, pal, out) {
  v = v < 0 ? 0 : v > 0.9999 ? 0.9999 : v;
  var f = v * (pal.length - 1);
  var i = f | 0, k = f - i;
  var a2 = pal[i], b2 = pal[i + 1];
  out[0] = a2[0] + (b2[0] - a2[0]) * k;
  out[1] = a2[1] + (b2[1] - a2[1]) * k;
  out[2] = a2[2] + (b2[2] - a2[2]) * k;
}

var _rgb = [0, 0, 0];

function bsample(arr, w, h, u, v) {
  var x = u * w - 0.5, y = v * h - 0.5;
  x = x < 0 ? 0 : x > w - 1.001 ? w - 1.001 : x;
  y = y < 0 ? 0 : y > h - 1.001 ? h - 1.001 : y;
  var x0 = x | 0, y0 = y | 0, ax = x - x0, ay = y - y0;
  var x1 = x0 + 1 < w ? x0 + 1 : x0, y1 = y0 + 1 < h ? y0 + 1 : y0;
  var r0 = y0 * w, r1 = y1 * w;
  return arr[r0 + x0] * (1 - ax) * (1 - ay) + arr[r0 + x1] * ax * (1 - ay) +
         arr[r1 + x0] * (1 - ax) * ay + arr[r1 + x1] * ax * ay;
}

/* running-sum box blur: each output costs two adds regardless of radius,
   instead of one per tap. the wide vertical kernel was the entire cost. */
function boxBlur(src, dst, w, h, r) {
  var x, y, i;
  for (y = 0; y < h; y++) {
    var b = y * w, sum = 0, n = 0;
    for (i = 0; i <= r && i < w; i++) { sum += src[b + i]; n++; }
    for (x = 0; x < w; x++) {
      dst[b + x] = sum / n;
      var addI = x + r + 1, remI = x - r;
      if (addI < w) { sum += src[b + addI]; n++; }
      if (remI >= 0) { sum -= src[b + remI]; n--; }
    }
  }
  for (x = 0; x < w; x++) {
    var sum2 = 0, n2 = 0;
    for (i = 0; i <= r && i < h; i++) { sum2 += dst[i * w + x]; n2++; }
    for (y = 0; y < h; y++) {
      src[y * w + x] = sum2 / n2;
      var addJ = y + r + 1, remJ = y - r;
      if (addJ < h) { sum2 += dst[addJ * w + x]; n2++; }
      if (remJ >= 0) { sum2 -= dst[remJ * w + x]; n2--; }
    }
  }
}

function drawBloom(tsec) {
  var i, x, y;

  /* 1. coverage. the warp touches the background only — distorting the
        silhouette is what stopped it looking like a specific person. */
  /* the mask is already smooth, so nearest with a half-cell offset is
     indistinguishable here and avoids 70k bilinear calls per frame */
  var mScaleX = MW / BW, mScaleY = MH / BH;
  for (y = 0; y < BH; y++) {
    var my = (y * mScaleY) | 0;
    if (my >= MH) my = MH - 1;
    var mrow = my * MW;
    for (x = 0; x < BW; x++) {
      var mx = (x * mScaleX) | 0;
      if (mx >= MW) mx = MW - 1;
      var c = maskGrid[mrow + mx];
      if (P.bwarp > 0 && c < 0.5) {
        var n = noise2(x, y, tsec * P.bspeed);
        var wx = ((x + n * P.bwarp) * mScaleX) | 0;
        var wy = ((y + n * P.bwarp * 0.6) * mScaleY) | 0;
        if (wx >= 0 && wx < MW && wy >= 0 && wy < MH) c = maskGrid[wy * MW + wx];
      }
      bloomF[i = y * BW + x] = c;
      bloomD[i] = c;
    }
  }

  /* 2. VOLUME. downsample the coverage repeatedly, blur each level, and sum
        the levels back. the result is a wide smooth dome: high deep inside
        the body, falling off toward every edge. this is what makes it read
        as a depth map rather than a flat cut-out. */
  var src = bloomD, sw = BW, sh = BH;
  for (var lv = 0; lv < PYR.length; lv++) {
    var L = PYR[lv];
    for (y = 0; y < L.h; y++) {
      for (x = 0; x < L.w; x++) {
        var sx0 = (x * 2) < sw ? x * 2 : sw - 1;
        var sy0 = (y * 2) < sh ? y * 2 : sh - 1;
        var sx1 = (sx0 + 1) < sw ? sx0 + 1 : sx0;
        var sy1 = (sy0 + 1) < sh ? sy0 + 1 : sy0;
        L.a[y * L.w + x] = (src[sy0 * sw + sx0] + src[sy0 * sw + sx1] +
                            src[sy1 * sw + sx0] + src[sy1 * sw + sx1]) / 4;
      }
    }
    boxBlur(L.a, L.b, L.w, L.h, 2);
    src = L.a; sw = L.w; sh = L.h;
  }
  var wtTot = 0;
  for (var lw = 0; lw < PYR.length; lw++) wtTot += 1 / (lw + 1);
  for (y = 0; y < BH; y++) {
    for (x = 0; x < BW; x++) {
      var acc = 0;
      for (var lv2 = 0; lv2 < PYR.length; lv2++) {
        var L2 = PYR[lv2];
        var qy = (y * L2.h / BH) | 0, qx = (x * L2.w / BW) | 0;
        if (qy >= L2.h) qy = L2.h - 1;
        if (qx >= L2.w) qx = L2.w - 1;
        acc += L2.a[qy * L2.w + qx] / (lv2 + 1);
      }
      bloomD[y * BW + x] = acc / wtTot;
    }
  }

  /* 3. the silhouette, blurred on its own terms */
  var R = 4;
  for (var pass = 0; pass < 2; pass++) {
    boxBlur(bloomF, bloomT, BW, BH, R);
  }
  var RV = Math.round(R * (1 + P.smear * 3));
  for (var x3 = 0; x3 < BW; x3++) {
    var sum3 = 0, n3 = 0;
    for (i = 0; i <= RV && i < BH; i++) { sum3 += bloomF[i * BW + x3]; n3++; }
    for (var y3 = 0; y3 < BH; y3++) {
      bloomT[y3 * BW + x3] = sum3 / n3;
      var aI = y3 + RV + 1, rI = y3 - RV;
      if (aI < BH) { sum3 += bloomF[aI * BW + x3]; n3++; }
      if (rI >= 0) { sum3 -= bloomF[rI * BW + x3]; n3--; }
    }
  }
  for (i = 0; i < bloomF.length; i++) bloomF[i] = bloomT[i];

  /* 4. surface detail from luminance, softened independently */
  var lScaleX = FW / BW, lScaleY = FH / BH;
  for (y = 0; y < BH; y++) {
    var ly2 = (y * lScaleY) | 0;
    if (ly2 >= FH) ly2 = FH - 1;
    var lrow = ly2 * FW;
    for (x = 0; x < BW; x++) {
      var lx2 = (x * lScaleX) | 0;
      if (lx2 >= FW) lx2 = FW - 1;
      bloomL[y * BW + x] = lumaField[lrow + lx2];
    }
  }
  var LR = Math.max(0, Math.round(P.bsoft));
  if (LR > 0) {
    for (var lp = 0; lp < 2; lp++) boxBlur(bloomL, bloomL2, BW, BH, LR);
  }

  /* 5. combine into a single depth-like scalar */
  for (i = 0; i < bloomF.length; i++) {
    var soft = bloomF[i];
    bloomT[i] = soft * (P.bvol * bloomD[i] + 0.10 +
                        bloomL[i] * P.bform) + (1 - soft) * 0.02;
  }
}

/* per-pixel palette mapping at output resolution */
function paintBloom(tsec) {
  var pal = PALETTES[P.palette | 0] || PALETTES[0];
  var w = outW, h = outH;
  var d = outImg.data;
  var crm = coverRect();
  // map each output pixel back into field space through the same cover fit
  var invW = 1 / w, invH = 1 / h;
  var sx = W * invW, sy = H * invH;
  var gain = P.bgain, shift = (tsec * P.bhue * 0.05) % 1;
  var o = 0;
  for (var y = 0; y < h; y++) {
    var py = y * sy;
    var v = (py - crm.y) / crm.h;
    for (var x = 0; x < w; x++) {
      var px = x * sx;
      var u = (px - crm.x) / crm.w;
      var val = bsample(bloomT, BW, BH, u, v) * gain;
      // a little ordered noise before quantisation: 8-bit gradients band
      // badly across large smooth areas and the rings read as cheap
      val += (((x * 7 + y * 13) & 15) / 15 - 0.5) * 0.012;
      if (shift) val = (val + shift) % 1;
      paletteAt(val, pal, _rgb);
      d[o] = _rgb[0]; d[o + 1] = _rgb[1]; d[o + 2] = _rgb[2]; d[o + 3] = 255;
      o += 4;
    }
  }
  octx.putImageData(outImg, 0, 0);
}

/* ---------- streamline tracers ----------
   each tracer walks along the contour field leaving a thin trail, then
   respawns. thousands of short curves following the same field is what
   produces the woodgrain look in the references. */
var tracers = [];
function seedTracers(n) {
  var guard = 0;
  while (tracers.length < n && guard < n * 12) {
    guard++;
    var x = Math.random() * FW, y = Math.random() * FH;
    if (!regionOK(x, y) && guard < n * 8) continue;
    tracers.push({ x: x, y: y,
                   age: Math.random() * 90, life: 40 + Math.random() * 70 });
  }
  if (tracers.length > n) tracers.length = n;
}
function respawn(t) {
  // land inside the chosen region, where the field also has structure
  for (var i = 0; i < 14; i++) {
    var x = Math.random() * FW, y = Math.random() * FH;
    if (!regionOK(x, y)) continue;
    if (fieldA[(y | 0) * FW + (x | 0)] > 0.08) {
      t.x = x; t.y = y; t.age = 0;
      t.life = 40 + Math.random() * 70;
      return;
    }
  }
  for (var j = 0; j < 10; j++) {
    var x2 = Math.random() * FW, y2 = Math.random() * FH;
    if (regionOK(x2, y2)) {
      t.x = x2; t.y = y2; t.age = 0;
      t.life = 30 + Math.random() * 50;
      return;
    }
  }
  t.x = Math.random() * FW; t.y = Math.random() * FH;
  t.age = 0; t.life = 30 + Math.random() * 50;
}

/* ---------- render ---------- */
var W = 0, H = 0, dpr = 1, hue = 0, raf = 0, last = 0, running = false;
var buf = document.createElement("canvas");
var bctx = buf.getContext("2d");

function resize() {
  var r = document.getElementById("stage").getBoundingClientRect();
  var w = Math.max(Math.round(r.width), window.innerWidth || 0, 1);
  var h = Math.max(Math.round(r.height), window.innerHeight || 0,
                   document.documentElement.clientHeight || 0, 1);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (w === W && h === H) return;
  W = w; H = h;
  view.width = Math.round(W * dpr); view.height = Math.round(H * dpr);
  buf.width = view.width; buf.height = view.height;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

function frame(t) {
  raf = requestAnimationFrame(frame);
  if (!running) return;
  var dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  resize();
  matchAspect();
  computeFlow();
  if (useMask && segReady) { updateFace(t); updateMask(t); }

  hue += P.hue * dt * 22;

  /* BLOOM owns the whole frame: no feedback, no streamlines, no rim. it is
     an image, not an accumulation, so it is drawn straight and returns. */
  if (mode === 4) {
    // the shading wants a fresh frame; the local-contrast pass is for the
    // streamlines and fights the softness here
    sctx.drawImage(cam, 0, 0, SW, SH);
    var keepC = P.contrast;
    P.contrast = keepC * 0.25;
    buildLuma();
    P.contrast = keepC;

    // output buffer at CSS resolution, so every pixel gets its own palette
    // lookup rather than being an interpolation between two mapped cells
    var ow = Math.max(1, Math.round(W * P.bres));
    var oh = Math.max(1, Math.round(H * P.bres));
    if (ow !== outW || oh !== outH) {
      outW = ow; outH = oh;
      outCv.width = ow; outCv.height = oh;
      outImg = octx.createImageData(ow, oh);
    }

    drawBloom(t / 1000);
    paintBloom(t / 1000);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.scale(dpr, dpr);
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.imageSmoothingEnabled = true;
    var layers = 1 + Math.round(P.smear * 3);
    for (var li = 0; li < layers; li++) {
      var f3 = li / Math.max(1, layers);
      ctx.globalAlpha = li === 0 ? 1 : 0.45 * (1 - f3);
      var ext = f3 * P.smear * H * 0.4;
      ctx.drawImage(outCv, 0, -ext, W, H + ext * 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  var cw = view.width, chh = view.height;

  /* 1. feedback — the previous frame, scaled, rotated and pushed by the
        overall drift of the flow. this is what makes tunnels and smears. */
  var avx = 0, avy = 0, tot = 0;
  for (var i = 0; i < fm.length; i++) {
    if (fm[i] <= P.thresh) continue;
    var mgy = Math.floor(i / COLS) / ROWS, mgx = (i % COLS) / COLS;
    var wgt = useMask && segReady ? Math.min(1, maskAt(mgx, mgy)) : 1;
    if (wgt < 0.15) continue;
    avx += fx[i] * wgt; avy += fy[i] * wgt; tot += wgt;
  }
  if (tot) { avx /= tot; avy /= tot; }

  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, cw, chh);
  bctx.globalAlpha = P.feedback;
  bctx.save();
  bctx.translate(cw / 2 + avx * P.drift * 40 * dpr,
                 chh / 2 + avy * P.drift * 40 * dpr);
  bctx.rotate(P.spin * Math.PI / 180);
  bctx.scale(P.zoom, P.zoom);
  bctx.drawImage(view, -cw / 2, -chh / 2, cw, chh);
  bctx.restore();
  /* bleed. additive light with a high feedback factor reaches a steady state
     of add/(1-feedback), which clips to white within a second. subtracting a
     little every frame gives it somewhere to go. */
  bctx.globalCompositeOperation = "destination-out";
  bctx.globalAlpha = P.bleed;
  bctx.fillStyle = "#000";
  bctx.fillRect(0, 0, cw, chh);
  bctx.globalCompositeOperation = "source-over";
  bctx.globalAlpha = 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#07060B";
  ctx.fillRect(0, 0, cw, chh);
  ctx.drawImage(buf, 0, 0);

  ctx.save();
  ctx.scale(dpr, dpr);
  if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }

  /* 2. mesh — the video drawn as a grid of cells, each displaced by the
        flow at that point, with the rgb channels pulled apart */
  if (useMesh) {
    /* a faint wash of the motion grid, well under the streamlines. the old
       full-alpha blocks were half of what made it burn out. */
    ctx.globalCompositeOperation = blend;
    var cwid = W / COLS, chgt = H / ROWS;
    for (var gy2 = 0; gy2 < ROWS; gy2++) {
      for (var gx2 = 0; gx2 < COLS; gx2++) {
        var idx = gy2 * COLS + gx2;
        var m = fm[idx];
        if (m <= P.thresh) continue;
        var mk = maskAt((gx2 + 0.5) / COLS, (gy2 + 0.5) / ROWS);
        if (mk < 0.12) continue;
        ctx.globalAlpha = Math.min(0.3, (m - P.thresh) * 4) * P.glow * 0.14;
        ctx.fillStyle = "hsl(" + ((hue + m * 400) % 360) + ",80%,45%)";
        ctx.fillRect(gx2 * cwid + fx[idx] * P.warp,
                     gy2 * chgt + fy[idx] * P.warp, cwid, chgt);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 2b. a hairline rim, so the silhouette is readable without a bloom */
  if (useMask && segReady && silReady && P.body > 0) {
    rctx.clearRect(0, 0, SILW, SILH);
    rctx.globalCompositeOperation = "source-over";
    var k = 1;
    for (var oy = -k; oy <= k; oy++) {
      for (var ox = -k; ox <= k; ox++) rctx.drawImage(sil, ox, oy);
    }
    rctx.globalCompositeOperation = "destination-out";
    rctx.drawImage(sil, 0, 0);
    rctx.globalCompositeOperation = "source-over";

    tctx.globalCompositeOperation = "source-over";
    tctx.clearRect(0, 0, SILW, SILH);
    tctx.drawImage(rim, 0, 0);
    tctx.globalCompositeOperation = "source-in";
    tctx.fillStyle = "hsl(" + ((hue % 360 + 360) % 360) + ",95%,46%)";
    tctx.fillRect(0, 0, SILW, SILH);

    ctx.globalCompositeOperation = blend;
    ctx.globalAlpha = Math.min(0.85, 0.45 * P.body);
    var cr = coverRect();
    ctx.drawImage(tint, cr.x, cr.y, cr.w, cr.h);
    ctx.globalAlpha = 1;
  }

  /* 2c. DOTS and MESH. drawn directly from the landmarks with nothing in
        between, so they track instantly — no field, no temporal smoothing,
        no feedback. this is the mode that feels stuck to your face. */
  if (mode > 0 && facePts && faceSeen) {
    var crm = coverRect();
    var hh3 = (hue % 360 + 360) % 360;
    ctx.globalCompositeOperation = blend;

    if ((mode === 2 || mode === 3) && faceConn && faceConn.mesh) {
      ctx.strokeStyle = "hsla(" + hh3 + ",88%,42%," +
                        (0.16 + P.mesh * 0.13) + ")";
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      var cn = faceConn.mesh;
      for (var mi = 0; mi < cn.length; mi++) {
        var pa = facePts[cn[mi].start], pb = facePts[cn[mi].end];
        if (!pa || !pb) continue;
        ctx.moveTo(crm.x + pa.x * crm.w, crm.y + pa.y * crm.h);
        ctx.lineTo(crm.x + pb.x * crm.w, crm.y + pb.y * crm.h);
      }
      ctx.stroke();
    }

    /* every tracked point, plus points interpolated along the mesh edges.
       the model always returns 468 landmarks, but each edge between two of
       them can be subdivided — those points are just as accurate because
       they are derived from real ones, and they let the dot count go far
       past what the model itself provides. */
    var zs = 0;
    for (var di = 0; di < facePts.length; di++) zs += facePts[di].z || 0;
    zs /= facePts.length || 1;

    var alphaD = Math.min(1, 0.45 + P.glow * 0.5);
    var satD = Math.round(50 + P.sat * 50);

    dotCtx = ctx; dotCrm = crm; dotZs = zs; dotHue = hh3;
    dotAlpha = alphaD; dotSat = satD; dotW = W; dotH = H;
    var wantDots = (mode === 1 || mode === 3);
    if (wantDots) {
      for (var pi2 = 0; pi2 < facePts.length; pi2++) {
        var q2 = facePts[pi2];
        dot(q2.x, q2.y, q2.z || 0);
      }
    }

    // subdivide: the lines slider sets how many extra dots per mesh edge
    var sub = Math.max(0, Math.min(5, Math.round(P.particles / 1300)));
    if (wantDots && sub > 0 && faceConn && faceConn.mesh) {
      var cn2 = faceConn.mesh;
      for (var si = 0; si < cn2.length; si++) {
        var sa = facePts[cn2[si].start], sb = facePts[cn2[si].end];
        if (!sa || !sb) continue;
        for (var kk = 1; kk <= sub; kk++) {
          var f2 = kk / (sub + 1);
          dot(sa.x + (sb.x - sa.x) * f2,
              sa.y + (sb.y - sa.y) * f2,
              (sa.z || 0) + ((sb.z || 0) - (sa.z || 0)) * f2);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 3. streamlines. this is the whole look — many thin curves following the
        contour field, drawn additively on black so they build up density
        where they overlap, exactly like the reference images. */
  if (mode === 0 && useParticles && P.particles > 0 &&
      useMask && segReady) {
    seedTracers(Math.round(P.particles));
    ctx.globalCompositeOperation = blend;
    ctx.lineCap = "round";
    var cr2 = coverRect();
    var sx2 = cr2.w / FW, sy2 = cr2.h / FH;
    var ox2 = cr2.x, oy2 = cr2.y;
    var steps = Math.round(4 + P.trail * 16);

    for (var ti = 0; ti < tracers.length; ti++) {
      var tr = tracers[ti];
      if (!isFinite(tr.x) || !isFinite(tr.y)) { respawn(tr); continue; }
      var v = fsamp(tr.x, tr.y);
      if (!isFinite(v) || v < 0.05 || !regionOK(tr.x, tr.y)) {
        respawn(tr); continue;
      }

      // colour by the field value: interior and rim read differently
      // spread hue across the field value and position, so a run of
      // strands is a gradient rather than one colour going white
      var hh2 = (hue + v * 190 + tr.x * 1.4 + tr.y * 0.9) % 360;
      var fade = 1 - tr.age / tr.life;
      /* a lighter strand reaches white after very few overlaps. keeping
         the base dark and highly saturated means overlap builds colour
         instead — measured, surviving saturation after five overlaps goes
         from 32% at L=58 to 84% at L=34. */
      ctx.strokeStyle = "hsl(" + hh2 + "," +
        Math.round(62 + P.sat * 38) + "%," +
        Math.round(20 + v * 22 + P.glow * 8) + "%)";
      ctx.lineWidth = 0.45 + v * 0.9;
      ctx.globalAlpha = Math.min(0.9, (0.14 + v * 0.5) * P.glow *
                                      Math.max(0, fade));

      ctx.beginPath();
      ctx.moveTo(ox2 + tr.x * sx2, oy2 + tr.y * sy2);
      var cx2 = tr.x, cy2 = tr.y;
      for (var st = 0; st < steps; st++) {
        var c = contourAt(cx2, cy2);
        if (!c || !isFinite(c.x) || !isFinite(c.y)) break;
        // the optical flow nudges the line, so moving warps the field
        var fl = sampleFlow(cx2 / FW, cy2 / FH);
        cx2 += c.x * 1.7 + fl.x * P.warp * 0.05;
        cy2 += c.y * 1.7 + fl.y * P.warp * 0.05;
        if (!isFinite(cx2) || !isFinite(cy2) ||
            cx2 < 0 || cx2 >= FW || cy2 < 0 || cy2 >= FH) break;
        ctx.lineTo(ox2 + cx2 * sx2, oy2 + cy2 * sy2);
      }
      ctx.stroke();

      // advance the head of the tracer along the field
      var h2 = contourAt(tr.x, tr.y);
      if (h2) { tr.x += h2.x * P.speed; tr.y += h2.y * P.speed; }
      tr.age += P.speed * 0.8;
      if (tr.age > tr.life || tr.x < 0 || tr.x >= FW ||
          tr.y < 0 || tr.y >= FH) respawn(tr);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

/* ---------- start ---------- */
document.getElementById("go").addEventListener("click", function () {
  errEl.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errEl.textContent = "This browser has no camera API. Needs HTTPS.";
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  }).then(function (stream) {
    cam.srcObject = stream;
    return cam.play();
  }).then(function () {
    gate.style.display = "none";
    panel.classList.add("open");
    // the streamlines are built from the person field, so load it up front
    if (!segTried) {
      useMask = true;
      document.getElementById("tMask").classList.add("on");
      loadSegmenter();
    }
    resize();
    running = true;
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
    setTimeout(function () { panel.classList.remove("open"); }, 2600);
  }).catch(function (e) {
    errEl.textContent = "Camera blocked: " + (e && e.name ? e.name : e) +
      ". Needs HTTPS and permission.";
  });
});

resize();
})();
</script>
</body>
