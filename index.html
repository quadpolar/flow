<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="theme-color" content="#07060B">
<title>Flow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent; }
  html, body {
    position:fixed; inset:0; overflow:hidden; background:#07060B;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    font:500 13px/1.35 -apple-system,'Helvetica Neue',Inter,system-ui,sans-serif;
    color:#EDE9F5;
  }
  #stage { position:fixed; inset:0; }
  #view  { position:absolute; inset:0; display:block;
           width:100%; height:100%; }
  video  { position:absolute; width:1px; height:1px; opacity:0;
           pointer-events:none; }

  /* start gate — camera needs a user gesture */
  #gate {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    padding:32px; background:#07060B; z-index:5;
  }
  #gate h1 { font-size:34px; font-weight:800; letter-spacing:-.03em; }
  #gate p  { max-width:300px; opacity:.55; font-size:13px; }
  #go {
    margin-top:6px; padding:15px 40px; border:0; border-radius:30px;
    background:#C9F24A; color:#0C1004; font-weight:800; font-size:15px;
    letter-spacing:.04em; cursor:pointer;
  }
  #err { color:#FF8A7A; font-size:12px; max-width:300px; min-height:16px; }

  /* controls */
  #panel {
    position:absolute; left:0; right:0; bottom:0; z-index:4;
    background:rgba(12,10,20,.82); backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.09);
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(calc(100% - 46px)); transition:transform .28s ease;
    max-height:74vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #panel.open { transform:translateY(0); }
  #grip {
    height:26px; display:flex; align-items:center; justify-content:center;
    gap:9px; cursor:pointer; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; opacity:.65;
  }
  #grip::before {
    content:''; width:34px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.3);
  }
  .presets { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 14px; }
  .presets button {
    flex:1 1 auto; padding:9px 4px; border:1px solid rgba(255,255,255,.14);
    border-radius:11px; background:rgba(255,255,255,.05); color:#EDE9F5;
    font:700 11px/1 inherit; letter-spacing:.05em; cursor:pointer;
  }
  .presets button:active { background:rgba(201,242,74,.22); }
  .row { margin-bottom:11px; }
  .row label {
    display:flex; justify-content:space-between; font-size:11px;
    letter-spacing:.05em; text-transform:uppercase; opacity:.62;
    margin-bottom:5px;
  }
  .row label b { font-weight:700; opacity:.95; font-variant-numeric:tabular-nums; }
  input[type=range] {
    -webkit-appearance:none; width:100%; height:22px; background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height:3px; border-radius:2px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:19px; height:19px; margin-top:-8px;
    border-radius:50%; background:#C9F24A;
  }
  input[type=range]::-moz-range-track {
    height:3px; border-radius:2px; background:rgba(255,255,255,.16);
  }
  input[type=range]::-moz-range-thumb {
    width:19px; height:19px; border:0; border-radius:50%; background:#C9F24A;
  }
  .toggles { display:flex; gap:7px; margin-top:4px; }
  .toggles button {
    flex:1; padding:9px 4px; border:1px solid rgba(255,255,255,.14);
    border-radius:11px; background:rgba(255,255,255,.05); color:#EDE9F5;
    font:700 11px/1 inherit; letter-spacing:.05em; cursor:pointer;
  }
  .toggles button.on { background:#C9F24A; color:#0C1004; border-color:#C9F24A; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <video id="cam" playsinline autoplay muted></video>

  <div id="gate">
    <h1>Flow</h1>
    <p>Your camera drives the visuals. Nothing is recorded, nothing leaves
       this device.</p>
    <button id="go">START CAMERA</button>
    <div id="err"></div>
  </div>

  <div id="panel">
    <div id="grip">controls</div>

    <div class="presets">
      <button data-p="silk">SILK</button>
      <button data-p="ember">EMBER</button>
      <button data-p="ghost">GHOST</button>
      <button data-p="ribbon">RIBBON</button>
      <button data-p="storm">STORM</button>
    </div>

    <div class="toggles">
      <button id="tMirror" class="on">MIRROR</button>
      <button id="tParticles" class="on">LINES</button>
      <button id="tMesh">WASH</button>
    <button id="tMask">ME ONLY</button>
    </div>

    <div id="sliders"></div>
  </div>
</div>

<script>
(function () {
"use strict";

var view = document.getElementById("view");
var cam = document.getElementById("cam");
var gate = document.getElementById("gate");
var errEl = document.getElementById("err");
var panel = document.getElementById("panel");
var ctx = view.getContext("2d");

/* ---------- parameters. every one is read fresh each frame, so a slider
   changes the piece immediately with no restart ---------- */
var P = {
  feedback: 0.82,   // how much of the last frame is kept
  zoom:     1.002,  // scale applied to the feedback each frame
  spin:     0.02,   // degrees of rotation on the feedback
  drift:    0.08,   // how far the feedback is pushed by the flow
  warp:     10,     // mesh displacement in px per unit of flow
  chroma:   6,      // rgb channel separation
  glow:     0.75,   // brightness of the ink laid down
  hue:      0.03,   // hue rotation per second
  sat:      0.85,
  particles: 820,
  trail:    0.85,   // particle streak length
  thresh:   0.06,   // motion below this is ignored
  edge:     1.2,    // how much the outline of you is favoured
  body:     0.35,    // how strongly your silhouette is drawn
  bleed:    0.10,  // stops light accumulating to white
  smooth:   0.10,  // how fast the field follows the camera
  speed:    0.32,  // how fast the lines travel
  deshake:  0.85,  // cancels whole-frame camera movement
};

var SPECS = [
  ["feedback",  "feedback",  0,    0.99,  0.01],
  ["zoom",      "zoom",      0.97, 1.05,  0.001],
  ["spin",      "spin",     -3,    3,     0.05],
  ["drift",     "drift",     0,    3,     0.05],
  ["warp",      "warp",      0,    140,   1],
  ["chroma",    "chroma",    0,    40,    1],
  ["glow",      "ink",       0,    1.6,   0.05],
  ["hue",       "hue drift", -2,   2,     0.05],
  ["sat",       "saturation",0,    1,     0.05],
  ["particles", "lines",     0,    900,   10],
  ["trail",     "line length",0,   1,     0.05],
  ["thresh",    "threshold", 0,    0.3,   0.005],
  ["edge",      "edge bias", 0,    3,     0.05],
  ["body",      "your outline", 0, 1.5,   0.05],
  ["bleed",     "bleed",     0,    0.3,   0.005],
  ["smooth",    "smoothing", 0.02, 1,     0.01],
  ["speed",     "speed",     0.1,  2.5,   0.05],
  ["deshake",   "de-shake",  0,    1,     0.05],
];

var PRESETS = {
  silk:    { feedback:.90, zoom:1.001, spin:.02, drift:.08, warp:9,
             chroma:5,  glow:.7,  hue:.04, sat:.5,  particles:820, trail:.85,
             thresh:.06, edge:1.0, body:.35, bleed:.07, smooth:.09,
             speed:.30, deshake:.9 },
  ember:   { feedback:.91, zoom:1.002, spin:.04, drift:.14, warp:16,
             chroma:8,  glow:.85, hue:.02, sat:.95, particles:760, trail:.9,
             thresh:.05, edge:1.3, body:.45, bleed:.06, smooth:.11,
             speed:.38, deshake:.85 },
  ghost:   { feedback:.95, zoom:1.000, spin:0,   drift:.05, warp:6,
             chroma:3,  glow:.42, hue:.02, sat:.2,  particles:560, trail:.95,
             thresh:.07, edge:1.5, body:.28, bleed:.04, smooth:.07,
             speed:.22, deshake:.95 },
  ribbon:  { feedback:.78, zoom:1.000, spin:0,   drift:.06, warp:12,
             chroma:7,  glow:1.0, hue:.12, sat:.85, particles:480, trail:1,
             thresh:.05, edge:.9,  body:.4,  bleed:.13, smooth:.14,
             speed:.55, deshake:.8 },
  storm:   { feedback:.88, zoom:1.004, spin:.18, drift:.5,  warp:44,
             chroma:16, glow:.95, hue:.25, sat:1,   particles:900, trail:.6,
             thresh:.04, edge:.8,  body:.55, bleed:.08, smooth:.22,
             speed:.9,  deshake:.6 },
};




var mirror = true, useParticles = true, useMesh = false, useMask = false;

/* ---------- build the sliders ---------- */
var wrap = document.getElementById("sliders");
var readouts = {};
SPECS.forEach(function (sp) {
  var key = sp[0];
  var row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<label>' + sp[1] + ' <b></b></label>' +
    '<input type="range" min="' + sp[2] + '" max="' + sp[3] +
    '" step="' + sp[4] + '">';
  var input = row.querySelector("input");
  var out = row.querySelector("b");
  readouts[key] = { input: input, out: out, step: sp[4] };
  input.value = P[key];
  out.textContent = fmt(P[key], sp[4]);
  input.addEventListener("input", function () {
    P[key] = parseFloat(input.value);
    out.textContent = fmt(P[key], sp[4]);
  });
  wrap.appendChild(row);
});

function fmt(v, step) {
  var d = step >= 1 ? 0 : String(step).split(".")[1].length;
  return v.toFixed(d);
}

function syncUI() {
  SPECS.forEach(function (sp) {
    var r = readouts[sp[0]];
    r.input.value = P[sp[0]];
    r.out.textContent = fmt(P[sp[0]], r.step);
  });
}

document.querySelectorAll(".presets button").forEach(function (b) {
  b.addEventListener("click", function () {
    var pr = PRESETS[b.dataset.p];
    for (var k in pr) P[k] = pr[k];
    syncUI();
  });
});

function toggle(id, get, set) {
  var el = document.getElementById(id);
  el.addEventListener("click", function () {
    set(!get());
    el.classList.toggle("on", get());
  });
}
toggle("tMirror", function () { return mirror; },
       function (v) { mirror = v; });
toggle("tParticles", function () { return useParticles; },
       function (v) { useParticles = v; });
toggle("tMesh", function () { return useMesh; },
       function (v) { useMesh = v; });
toggle("tMask", function () { return useMask; },
       function (v) {
         useMask = v;
         if (v && !segReady && !segTried) loadSegmenter();
         // make the change unmistakable rather than subtle
         if (v && P.body < 0.5) {
           P.body = 0.9;
           var r = readouts["body"];
           if (r) { r.input.value = P.body; r.out.textContent = fmt(P.body, r.step); }
         }
       });

document.getElementById("grip").addEventListener("click", function () {
  panel.classList.toggle("open");
});

/* ---------- person mask ----------
   MediaPipe Image Segmenter, loaded from a CDN on demand. it returns a
   per-pixel person/background mask which is downsampled onto the flow grid,
   so motion in the background can be suppressed and the outline of the
   subject can be emphasised. entirely optional — if the CDN is unreachable
   the toggle switches itself off and everything else carries on. */
var segmenter = null, segReady = false, segTried = false, segErr = "";
var MW = 64, MH = 48;                 // mask resolution on the flow grid
var maskGrid = new Float32Array(MW * MH);
var maskCanvas = document.createElement("canvas");
maskCanvas.width = MW; maskCanvas.height = MH;
var mctx = maskCanvas.getContext("2d", { willReadFrequently: true });

/* a higher-resolution silhouette, used to actually DRAW you rather than
   just weight the abstract layers. without something on screen shaped like
   a person there is no way to tell the effect is reacting to you at all. */
var SILW = 384, SILH = 288;  // resized to the video aspect
var sil = document.createElement("canvas");
sil.width = SILW; sil.height = SILH;
var silctx = sil.getContext("2d");
var silImg = silctx.createImageData(SILW, SILH);
var silReady = false;
/* ---------- streamline field ----------
   the references are all flow fields: thousands of thin curves following the
   contours of a face. that needs a SMOOTH scalar field, not a hard mask —
   the contour direction is perpendicular to the gradient, and a hard edge
   gives a gradient that is zero everywhere except one pixel. so the mask is
   blurred heavily, sampled bilinearly, and combined with the camera's own
   luminance so the interior has structure too. */
var FW = 176, FH = 132;   // resized to the video aspect on first frame
var fieldA = new Float32Array(FW * FH);
var fieldB = new Float32Array(FW * FH);
var fieldPrev = new Float32Array(FW * FH);
var fieldSeeded = false;
var fieldMax = 1;

function buildField(arr, w, h, lumaSrc) {
  // mask, plus luminance inside it so the face has internal contours
  for (var y = 0; y < FH; y++) {
    var ry = Math.floor(y * h / FH);
    for (var x = 0; x < FW; x++) {
      var rx = Math.floor(x * w / FW);
      var on = arr[ry * w + rx] !== 0 ? 1 : 0;
      var l = lumaSrc ? lumaSrc[(y * FW + x)] : 0;
      /* luminance dominates inside the mask, so the face and torso carry
         real contours. with a flat interior the gradient is zero and the
         only lines that appear are on the silhouette edge. */
      fieldA[y * FW + x] = on ? (0.18 + l * 1.5) : 0;
    }
  }
  /* separable box blur. a wide radius matters more than many small passes:
     the streamline has to see a smooth field or it wanders off its isoline.
     measured, radius 3 takes the drift from 0.19 to under 0.10. */
  var R = 3;
  for (var pass = 0; pass < 2; pass++) {
    for (var y3 = 0; y3 < FH; y3++) {
      var base = y3 * FW;
      for (var x3 = 0; x3 < FW; x3++) {
        var sum = 0, cnt = 0;
        for (var k = -R; k <= R; k++) {
          var xx = x3 + k;
          if (xx < 0 || xx >= FW) continue;
          sum += fieldA[base + xx]; cnt++;
        }
        fieldB[base + x3] = sum / cnt;
      }
    }
    for (var x4 = 0; x4 < FW; x4++) {
      for (var y4 = 0; y4 < FH; y4++) {
        var sum2 = 0, cnt2 = 0;
        for (var k2 = -R; k2 <= R; k2++) {
          var yy = y4 + k2;
          if (yy < 0 || yy >= FH) continue;
          sum2 += fieldB[yy * FW + x4]; cnt2++;
        }
        fieldA[y4 * FW + x4] = sum2 / cnt2;
      }
    }
  }

  /* ease the field toward its new state instead of replacing it. a knock to
     the camera and a flickering segmentation edge both arrive as a sudden
     change; blending removes the jitter from both without losing detail. */
  var ease = fieldSeeded ? P.smooth : 1;
  fieldSeeded = true;
  for (var i2 = 0; i2 < fieldA.length; i2++) {
    fieldPrev[i2] += (fieldA[i2] - fieldPrev[i2]) * ease;
    fieldA[i2] = fieldPrev[i2];
  }
  // track the peak so thresholds are relative, not absolute
  var pk = 0;
  for (var i3 = 0; i3 < fieldA.length; i3++) {
    if (fieldA[i3] > pk) pk = fieldA[i3];
  }
  fieldMax = Math.max(0.05, pk);
}

function fsamp(x, y) {
  x = Math.max(2, Math.min(FW - 3, x));
  y = Math.max(2, Math.min(FH - 3, y));
  var x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
  var i = y0 * FW + x0;
  return fieldA[i] * (1 - fx) * (1 - fy) + fieldA[i + 1] * fx * (1 - fy) +
         fieldA[i + FW] * (1 - fx) * fy + fieldA[i + FW + 1] * fx * fy;
}

/* the camera is 4:3 and the phone is much taller. drawing the mask across
   the full screen stretches it — measured, that squashes x to 0.35 of its
   correct width. cover-fit scales to fill and crops the overflow instead. */
function coverRect() {
  /* the aspect must come from the VIDEO, not from the buffer it was sampled
     into. iOS often delivers portrait frames; assuming 4:3 stretches the
     mask horizontally, which reads as the subject being too wide. */
  var vw = cam.videoWidth || 640, vh = cam.videoHeight || 480;
  var sc = Math.max(W / vw, H / vh);
  var dw = vw * sc, dh = vh * sc;
  return { x: (W - dw) / 2, y: (H - dh) / 2, w: dw, h: dh };
}

/* the contour direction: perpendicular to the gradient */
function contourAt(x, y) {
  var d = 2.8;
  var gx = fsamp(x + d, y) - fsamp(x - d, y);
  var gy = fsamp(x, y + d) - fsamp(x, y - d);
  var m = Math.hypot(gx, gy);
  if (m < 1e-4) return null;
  return { x: -gy / m, y: gx / m, m: m };
}

/* luminance of the camera at field resolution, so the interior of the face
   carries contours rather than being flat */
var lumaField = new Float32Array(FW * FH);
function buildLuma() {
  var d = sctx.getImageData(0, 0, SW, SH).data;
  for (var y = 0; y < FH; y++) {
    var ry = Math.floor(y * SH / FH);
    for (var x = 0; x < FW; x++) {
      var rx = Math.floor(x * SW / FW);
      var i = (ry * SW + rx) * 4;
      lumaField[y * FW + x] =
        (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
    }
  }
}

var rim = document.createElement("canvas");
rim.width = SILW; rim.height = SILH;
var rctx = rim.getContext("2d");
var tint = document.createElement("canvas");
tint.width = SILW; tint.height = SILH;
var tctx = tint.getContext("2d");

function loadSegmenter() {
  segTried = true;
  var el = document.getElementById("tMask");
  el.textContent = "LOADING…";
  import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14")
    .then(function (v) {
      return v.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      ).then(function (fileset) {
        return v.ImageSegmenter.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/" +
              "image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          outputCategoryMask: true,
          outputConfidenceMasks: false,
        });
      });
    })
    .then(function (seg) {
      segmenter = seg; segReady = true;
      el.textContent = "ME ONLY";
    })
    .catch(function (e) {
      segErr = String(e && e.message ? e.message : e);
      useMask = false; segReady = false;
      el.textContent = "ME ONLY";
      el.classList.remove("on");
      errEl.textContent = "Person mask unavailable — using plain motion.";
      setTimeout(function () { errEl.textContent = ""; }, 3400);
    });
}

function matchAspect() {
  var vw = cam.videoWidth, vh = cam.videoHeight;
  if (!vw || !vh) return;
  var a = vw / vh;
  var nSW = a >= 1 ? 256 : Math.round(256 * a);
  var nSH = a >= 1 ? Math.round(256 / a) : 256;
  if (nSW !== SW || nSH !== SH) {
    SW = nSW; SH = nSH;
    small.width = SW; small.height = SH;
    prev = null;
  }
  var nFW = a >= 1 ? 176 : Math.round(176 * a);
  var nFH = a >= 1 ? Math.round(176 / a) : 176;
  if (nFW !== FW || nFH !== FH) {
    FW = nFW; FH = nFH;
    fieldA = new Float32Array(FW * FH);
    fieldB = new Float32Array(FW * FH);
    fieldPrev = new Float32Array(FW * FH);
    fieldSeeded = false;
    lumaField = new Float32Array(FW * FH);
    tracers.length = 0;
  }
  var nSILW = a >= 1 ? 384 : Math.round(384 * a);
  var nSILH = a >= 1 ? Math.round(384 / a) : 384;
  if (nSILW !== SILW || nSILH !== SILH) {
    SILW = nSILW; SILH = nSILH;
    sil.width = SILW; sil.height = SILH;
    rim.width = SILW; rim.height = SILH;
    tint.width = SILW; tint.height = SILH;
    silImg = silctx.createImageData(SILW, SILH);
  }
}

function updateMask(tms) {
  if (!segReady || !segmenter) return;
  try {
    var res = segmenter.segmentForVideo(cam, tms);
    var cat = res && res.categoryMask;
    if (!cat) return;
    var w = cat.width, h = cat.height;
    var arr = cat.getAsUint8Array();
    // downsample onto the flow grid by area averaging
    for (var gy = 0; gy < MH; gy++) {
      var y0 = Math.floor(gy * h / MH), y1 = Math.floor((gy + 1) * h / MH);
      for (var gx = 0; gx < MW; gx++) {
        var x0 = Math.floor(gx * w / MW), x1 = Math.floor((gx + 1) * w / MW);
        var hit = 0, n = 0;
        for (var y = y0; y < y1; y += 2) {
          for (var x = x0; x < x1; x += 2) {
            if (arr[y * w + x] !== 0) hit++;
            n++;
          }
        }
        var v = n ? hit / n : 0;
        var i = gy * MW + gx;
        maskGrid[i] += (v - maskGrid[i]) * 0.5;   // soften over time
      }
    }
    // and a proper silhouette bitmap at higher resolution
    var d = silImg.data;
    for (var sy = 0; sy < SILH; sy++) {
      var ry = Math.floor(sy * h / SILH);
      for (var sx = 0; sx < SILW; sx++) {
        var rx = Math.floor(sx * w / SILW);
        /* sample a small neighbourhood instead of one pixel. a 1-bit mask
           upscaled to the screen stair-steps badly; averaging gives a soft
           edge that survives the scale. */
        var acc = 0, cnt3 = 0;
        for (var ny = -1; ny <= 1; ny++) {
          for (var nx = -1; nx <= 1; nx++) {
            var qy = ry + ny * 2, qx = rx + nx * 2;
            if (qy < 0 || qy >= h || qx < 0 || qx >= w) continue;
            if (arr[qy * w + qx] !== 0) acc++;
            cnt3++;
          }
        }
        var o = (sy * SILW + sx) * 4;
        d[o] = 255; d[o + 1] = 255; d[o + 2] = 255;
        d[o + 3] = cnt3 ? Math.round(255 * acc / cnt3) : 0;
      }
    }
    silctx.putImageData(silImg, 0, 0);
    silReady = true;
    buildLuma();
    buildField(arr, w, h, lumaField);

    cat.close();
  } catch (e) { /* a dropped frame is not worth stopping for */ }
}

/* how much of "you" is at this point, 0..1, plus an edge term so the
   silhouette itself reads strongest */
function maskAt(u, v) {
  if (!useMask || !segReady) return 1;
  var gx = Math.max(0, Math.min(MW - 1, Math.floor(u * MW)));
  var gy = Math.max(0, Math.min(MH - 1, Math.floor(v * MH)));
  var c = maskGrid[gy * MW + gx];
  if (P.edge <= 0) return c;
  var l = maskGrid[gy * MW + Math.max(0, gx - 1)];
  var r = maskGrid[gy * MW + Math.min(MW - 1, gx + 1)];
  var t = maskGrid[Math.max(0, gy - 1) * MW + gx];
  var b = maskGrid[Math.min(MH - 1, gy + 1) * MW + gx];
  var edge = Math.abs(l - r) + Math.abs(t - b);
  return Math.min(1.6, c + edge * P.edge);
}

/* ---------- optical flow ----------
   the video is drawn into a small hidden canvas, and each cell is compared
   with the same cell in the previous frame. shifting the cell by one step in
   each direction and taking whichever shift best explains the change gives a
   direction — that is the flow. no model, no face detection, works in any
   light and responds to hands and background too. */
var SW = 256, SH = 192;         // sampling resolution, corrected to the video
var COLS = 32, ROWS = 24;       // flow grid
var small = document.createElement("canvas");
small.width = SW; small.height = SH;
var sctx = small.getContext("2d", { willReadFrequently: true });

var prev = null;
var fx = new Float32Array(COLS * ROWS);
var fy = new Float32Array(COLS * ROWS);
var fm = new Float32Array(COLS * ROWS);

function lum(d, x, y) {
  var i = (y * SW + x) * 4;
  return (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
}

function computeFlow() {
  sctx.drawImage(cam, 0, 0, SW, SH);
  var cur = sctx.getImageData(0, 0, SW, SH).data;
  if (!prev) { prev = cur; return; }

  var cw = SW / COLS, ch = SH / ROWS;
  for (var gy = 0; gy < ROWS; gy++) {
    for (var gx = 0; gx < COLS; gx++) {
      var px = Math.floor(gx * cw + cw / 2);
      var py = Math.floor(gy * ch + ch / 2);
      if (px < 2 || py < 2 || px > SW - 3 || py > SH - 3) continue;

      var diff = 0, n = 0;
      for (var oy = -1; oy <= 1; oy++) {
        for (var ox = -1; ox <= 1; ox++) {
          diff += Math.abs(lum(cur, px + ox, py + oy) -
                           lum(prev, px + ox, py + oy));
          n++;
        }
      }
      diff /= n;

      // spatial gradient of the current frame
      var gxv = lum(cur, px + 2, py) - lum(cur, px - 2, py);
      var gyv = lum(cur, px, py + 2) - lum(cur, px, py - 2);
      // temporal difference
      var dt = lum(cur, px, py) - lum(prev, px, py);
      var g2 = gxv * gxv + gyv * gyv + 1e-4;

      var i = gy * COLS + gx;
      var vx = -dt * gxv / g2;
      var vy = -dt * gyv / g2;
      vx = Math.max(-3, Math.min(3, vx));
      vy = Math.max(-3, Math.min(3, vy));
      // smooth over time so the field is fluid rather than jittery
      fx[i] += (vx - fx[i]) * 0.35;
      fy[i] += (vy - fy[i]) * 0.35;
      fm[i] += (diff - fm[i]) * 0.4;
    }
  }
  /* a knock to the camera moves every cell at once. subtracting the median
     drift leaves only motion that is genuinely yours, which is what stops
     the whole field lurching when the phone is jostled. */
  var mx2 = 0, my2 = 0, cnt4 = 0;
  for (var q = 0; q < fx.length; q++) {
    if (fm[q] > 0.01) { mx2 += fx[q]; my2 += fy[q]; cnt4++; }
  }
  if (cnt4 > fx.length * 0.35) {          // only when MOST cells are moving
    mx2 /= cnt4; my2 /= cnt4;
    for (var q2 = 0; q2 < fx.length; q2++) {
      fx[q2] -= mx2 * P.deshake;
      fy[q2] -= my2 * P.deshake;
    }
  }
  prev = cur;
}

function sampleFlow(u, v) {
  var gx = Math.max(0, Math.min(COLS - 1, Math.floor(u * COLS)));
  var gy = Math.max(0, Math.min(ROWS - 1, Math.floor(v * ROWS)));
  var i = gy * COLS + gx;
  return { x: fx[i], y: fy[i], m: fm[i] };
}

/* ---------- streamline tracers ----------
   each tracer walks along the contour field leaving a thin trail, then
   respawns. thousands of short curves following the same field is what
   produces the woodgrain look in the references. */
var tracers = [];
function seedTracers(n) {
  while (tracers.length < n) {
    tracers.push({ x: Math.random() * FW, y: Math.random() * FH,
                   age: Math.random() * 90, life: 40 + Math.random() * 70 });
  }
  if (tracers.length > n) tracers.length = n;
}
function respawn(t) {
  // prefer to start on the subject, where the field has structure
  for (var i = 0; i < 8; i++) {
    var x = Math.random() * FW, y = Math.random() * FH;
    if (fieldA[(y | 0) * FW + (x | 0)] > 0.22) {
      t.x = x; t.y = y; t.age = 0;
      t.life = 40 + Math.random() * 70;
      return;
    }
  }
  t.x = Math.random() * FW; t.y = Math.random() * FH;
  t.age = 0; t.life = 30 + Math.random() * 50;
}

/* ---------- render ---------- */
var W = 0, H = 0, dpr = 1, hue = 0, raf = 0, last = 0, running = false;
var buf = document.createElement("canvas");
var bctx = buf.getContext("2d");

function resize() {
  var r = document.getElementById("stage").getBoundingClientRect();
  var w = Math.max(Math.round(r.width), window.innerWidth || 0, 1);
  var h = Math.max(Math.round(r.height), window.innerHeight || 0,
                   document.documentElement.clientHeight || 0, 1);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (w === W && h === H) return;
  W = w; H = h;
  view.width = Math.round(W * dpr); view.height = Math.round(H * dpr);
  buf.width = view.width; buf.height = view.height;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

function frame(t) {
  raf = requestAnimationFrame(frame);
  if (!running) return;
  var dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  resize();
  matchAspect();
  computeFlow();
  if (useMask && segReady) updateMask(t);

  hue += P.hue * dt * 22;

  var cw = view.width, chh = view.height;

  /* 1. feedback — the previous frame, scaled, rotated and pushed by the
        overall drift of the flow. this is what makes tunnels and smears. */
  var avx = 0, avy = 0, tot = 0;
  for (var i = 0; i < fm.length; i++) {
    if (fm[i] <= P.thresh) continue;
    var mgy = Math.floor(i / COLS) / ROWS, mgx = (i % COLS) / COLS;
    var wgt = useMask && segReady ? Math.min(1, maskAt(mgx, mgy)) : 1;
    if (wgt < 0.15) continue;
    avx += fx[i] * wgt; avy += fy[i] * wgt; tot += wgt;
  }
  if (tot) { avx /= tot; avy /= tot; }

  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, cw, chh);
  bctx.globalAlpha = P.feedback;
  bctx.save();
  bctx.translate(cw / 2 + avx * P.drift * 40 * dpr,
                 chh / 2 + avy * P.drift * 40 * dpr);
  bctx.rotate(P.spin * Math.PI / 180);
  bctx.scale(P.zoom, P.zoom);
  bctx.drawImage(view, -cw / 2, -chh / 2, cw, chh);
  bctx.restore();
  /* bleed. additive light with a high feedback factor reaches a steady state
     of add/(1-feedback), which clips to white within a second. subtracting a
     little every frame gives it somewhere to go. */
  bctx.globalCompositeOperation = "destination-out";
  bctx.globalAlpha = P.bleed;
  bctx.fillStyle = "#000";
  bctx.fillRect(0, 0, cw, chh);
  bctx.globalCompositeOperation = "source-over";
  bctx.globalAlpha = 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#07060B";
  ctx.fillRect(0, 0, cw, chh);
  ctx.drawImage(buf, 0, 0);

  ctx.save();
  ctx.scale(dpr, dpr);
  if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }

  /* 2. mesh — the video drawn as a grid of cells, each displaced by the
        flow at that point, with the rgb channels pulled apart */
  if (useMesh) {
    /* a faint wash of the motion grid, well under the streamlines. the old
       full-alpha blocks were half of what made it burn out. */
    ctx.globalCompositeOperation = "lighter";
    var cwid = W / COLS, chgt = H / ROWS;
    for (var gy2 = 0; gy2 < ROWS; gy2++) {
      for (var gx2 = 0; gx2 < COLS; gx2++) {
        var idx = gy2 * COLS + gx2;
        var m = fm[idx];
        if (m <= P.thresh) continue;
        var mk = maskAt((gx2 + 0.5) / COLS, (gy2 + 0.5) / ROWS);
        if (mk < 0.12) continue;
        ctx.globalAlpha = Math.min(0.3, (m - P.thresh) * 4) * P.glow * 0.14;
        ctx.fillStyle = "hsl(" + ((hue + m * 400) % 360) + ",80%,45%)";
        ctx.fillRect(gx2 * cwid + fx[idx] * P.warp,
                     gy2 * chgt + fy[idx] * P.warp, cwid, chgt);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 2b. a hairline rim, so the silhouette is readable without a bloom */
  if (useMask && segReady && silReady && P.body > 0) {
    rctx.clearRect(0, 0, SILW, SILH);
    rctx.globalCompositeOperation = "source-over";
    var k = 1;
    for (var oy = -k; oy <= k; oy++) {
      for (var ox = -k; ox <= k; ox++) rctx.drawImage(sil, ox, oy);
    }
    rctx.globalCompositeOperation = "destination-out";
    rctx.drawImage(sil, 0, 0);
    rctx.globalCompositeOperation = "source-over";

    tctx.globalCompositeOperation = "source-over";
    tctx.clearRect(0, 0, SILW, SILH);
    tctx.drawImage(rim, 0, 0);
    tctx.globalCompositeOperation = "source-in";
    tctx.fillStyle = "hsl(" + ((hue % 360 + 360) % 360) + ",92%,64%)";
    tctx.fillRect(0, 0, SILW, SILH);

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.min(0.85, 0.45 * P.body);
    var cr = coverRect();
    ctx.drawImage(tint, cr.x, cr.y, cr.w, cr.h);
    ctx.globalAlpha = 1;
  }

  /* 3. streamlines. this is the whole look — many thin curves following the
        contour field, drawn additively on black so they build up density
        where they overlap, exactly like the reference images. */
  if (useParticles && P.particles > 0 && useMask && segReady) {
    seedTracers(Math.round(P.particles));
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    var cr2 = coverRect();
    var sx2 = cr2.w / FW, sy2 = cr2.h / FH;
    var ox2 = cr2.x, oy2 = cr2.y;
    var steps = Math.round(4 + P.trail * 16);

    for (var ti = 0; ti < tracers.length; ti++) {
      var tr = tracers[ti];
      var v = fsamp(tr.x, tr.y);
      if (v < 0.10) { respawn(tr); continue; }

      // colour by the field value: interior and rim read differently
      var hh2 = (hue + v * 120 + ti * 0.7) % 360;
      var fade = 1 - tr.age / tr.life;
      ctx.strokeStyle = "hsl(" + hh2 + "," +
        Math.round(55 + P.sat * 45) + "%," +
        Math.round(38 + v * 34) + "%)";
      ctx.lineWidth = 0.5 + v * 1.1;
      ctx.globalAlpha = Math.min(0.9, (0.14 + v * 0.5) * P.glow *
                                      Math.max(0, fade));

      ctx.beginPath();
      ctx.moveTo(ox2 + tr.x * sx2, oy2 + tr.y * sy2);
      var cx2 = tr.x, cy2 = tr.y;
      for (var st = 0; st < steps; st++) {
        var c = contourAt(cx2, cy2);
        if (!c) break;
        // the optical flow nudges the line, so moving warps the field
        var fl = sampleFlow(cx2 / FW, cy2 / FH);
        cx2 += c.x * 1.25 + fl.x * P.warp * 0.05;
        cy2 += c.y * 1.25 + fl.y * P.warp * 0.05;
        if (cx2 < 0 || cx2 >= FW || cy2 < 0 || cy2 >= FH) break;
        ctx.lineTo(ox2 + cx2 * sx2, oy2 + cy2 * sy2);
      }
      ctx.stroke();

      // advance the head of the tracer along the field
      var h2 = contourAt(tr.x, tr.y);
      if (h2) { tr.x += h2.x * P.speed; tr.y += h2.y * P.speed; }
      tr.age += P.speed * 0.8;
      if (tr.age > tr.life || tr.x < 0 || tr.x >= FW ||
          tr.y < 0 || tr.y >= FH) respawn(tr);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

/* ---------- start ---------- */
document.getElementById("go").addEventListener("click", function () {
  errEl.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errEl.textContent = "This browser has no camera API. Needs HTTPS.";
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  }).then(function (stream) {
    cam.srcObject = stream;
    return cam.play();
  }).then(function () {
    gate.style.display = "none";
    panel.classList.add("open");
    // the streamlines are built from the person field, so load it up front
    if (!segTried) {
      useMask = true;
      document.getElementById("tMask").classList.add("on");
      loadSegmenter();
    }
    resize();
    running = true;
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
    setTimeout(function () { panel.classList.remove("open"); }, 2600);
  }).catch(function (e) {
    errEl.textContent = "Camera blocked: " + (e && e.name ? e.name : e) +
      ". Needs HTTPS and permission.";
  });
});

resize();
})();
</script>
</body>
</html>
